<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account &mdash; Equine Edu</title>
<meta name="description" content="Create your free Equine Edu account to start learning about horses.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
.auth-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--soft-white);
}
.auth-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.25rem;
}
.auth-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 40px rgba(36, 54, 74,0.10);
  padding: 2.5rem 2.25rem;
  width: 100%;
  max-width: 420px;
}
.auth-logo {
  font-family: var(--font-display);
  font-size: 1.35rem;
  color: var(--heading);
  text-align: center;
  margin-bottom: 0.35rem;
  text-decoration: none;
  display: block;
}
.auth-logo span { color: var(--tan); }
.auth-heading {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--heading);
  text-align: center;
  margin: 0.75rem 0 0.35rem;
}
.auth-sub {
  color: var(--body-text);
  font-size: 0.88rem;
  text-align: center;
  margin-bottom: 1.75rem;
  line-height: 1.6;
}
.auth-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0 0 1.75rem;
}
.field-group {
  margin-bottom: 1.1rem;
}
.field-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--heading);
  text-transform: uppercase;
  margin-bottom: 0.45rem;
}
.field-group input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.93rem;
  color: var(--heading);
  background: var(--soft-white);
  transition: border-color 0.15s, box-shadow 0.15s;
  box-sizing: border-box;
}
.field-group input:focus {
  outline: none;
  border-color: var(--heading);
  box-shadow: 0 0 0 3px rgba(36, 54, 74,0.09);
  background: var(--white);
}
.field-group input.error { border-color: #dc2626; }
.field-hint {
  font-size: 0.77rem;
  color: var(--body-text);
  margin-top: 0.3rem;
}
.auth-btn {
  width: 100%;
  padding: 0.82rem;
  background: var(--heading);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.18s, transform 0.1s;
  letter-spacing: 0.02em;
  margin-top: 0.5rem;
}
.auth-btn:hover { background: #0f2347; }
.auth-btn:active { transform: scale(0.99); }
.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.auth-error {
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: var(--radius-sm);
  color: #dc2626;
  font-size: 0.84rem;
  padding: 0.65rem 0.85rem;
  margin-bottom: 1rem;
  display: none;
}
.auth-error.visible { display: block; }
.auth-success {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: var(--radius-sm);
  color: #15803d;
  font-size: 0.88rem;
  padding: 1rem 1rem;
  margin-bottom: 1rem;
  display: none;
  line-height: 1.6;
}
.auth-success.visible { display: block; }
.auth-switch {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.85rem;
  color: var(--body-text);
}
.auth-switch a {
  color: var(--heading);
  font-weight: 700;
  text-decoration: none;
}
.auth-switch a:hover { text-decoration: underline; }
.terms-note {
  font-size: 0.77rem;
  color: var(--body-text);
  text-align: center;
  margin-top: 1rem;
  line-height: 1.5;
}
</style>
</head>
<body class="auth-page">
<div id="site-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="../index.html" class="auth-logo">Equine <span>Edu</span></a>
    <h1 class="auth-heading">Create your account</h1>
    <p class="auth-sub">Free to start. Learn at your own pace.</p>
    <hr class="auth-divider">

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>

    <form id="signup-form" novalidate>
      <div class="field-group">
        <label for="display-name">Display Name</label>
        <input type="text" id="display-name" name="display_name" placeholder="Your name or username" autocomplete="name" required>
      </div>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
        <p class="field-hint">At least 8 characters.</p>
      </div>
      <button type="submit" class="auth-btn" id="submit-btn">Create Account</button>
    </form>

    <p class="terms-note">By signing up you agree to our Terms of Service and Privacy Policy.</p>
    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<div id="site-footer"></div>

<script src="../assets/js/supabase-client.js"></script>
<script>
  window.LAYOUT = {
    homeUrl:    '../index.html',
    coursesUrl: '../courses/index.html'
  };
</script>
<script src="../assets/js/layout.js"></script>
<script>
(function () {
  // If already logged in, redirect to account
  EEAuth.init(function (session) {
    if (session) {
      window.location.replace('../account/index.html');
    }
  });

  var form       = document.getElementById('signup-form');
  var submitBtn  = document.getElementById('submit-btn');
  var errorBox   = document.getElementById('auth-error');
  var successBox = document.getElementById('auth-success');

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
    successBox.classList.remove('visible');
  }
  function showSuccess(msg) {
    successBox.innerHTML = msg;
    successBox.classList.add('visible');
    errorBox.classList.remove('visible');
    form.style.display = 'none';
  }
  function clearMessages() {
    errorBox.classList.remove('visible');
    successBox.classList.remove('visible');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearMessages();

    var displayName = document.getElementById('display-name').value.trim();
    var email       = document.getElementById('email').value.trim();
    var password    = document.getElementById('password').value;

    if (!displayName) { showError('Please enter a display name.'); return; }
    if (!email)        { showError('Please enter your email.'); return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    var result = await EEAuth.signUp(email, password, displayName);

    if (result.error) {
      showError(result.error.message || 'Sign up failed. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      return;
    }

    // Supabase sends a confirmation email
    showSuccess(
      '<strong>Almost there!</strong><br>' +
      'We sent a confirmation email to <strong>' + email + '</strong>. ' +
      'Click the link in that email to activate your account, then come back to log in.'
    );
  });
})();
</script>
</body>
</html>
