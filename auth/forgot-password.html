<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &mdash; Equine Edu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
.auth-page{min-height:100vh;display:flex;flex-direction:column;background:var(--off-white);}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.25rem;}
.auth-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 8px 40px rgba(13,27,62,0.10);padding:2.5rem 2.25rem;width:100%;max-width:420px;}
.auth-logo{font-family:var(--font-display);font-size:1.35rem;color:var(--navy);text-align:center;margin-bottom:.35rem;text-decoration:none;display:block;}
.auth-logo span{color:var(--gold);}
.auth-heading{font-family:var(--font-display);font-size:1.5rem;color:var(--navy);text-align:center;margin:.75rem 0 .35rem;}
.auth-sub{color:var(--text-mid);font-size:.88rem;text-align:center;margin-bottom:1.75rem;line-height:1.6;}
.auth-divider{border:none;border-top:1px solid var(--border);margin:0 0 1.75rem;}
.field-group{margin-bottom:1.1rem;}
.field-group label{display:block;font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--navy);text-transform:uppercase;margin-bottom:.45rem;}
.field-group input{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.93rem;color:var(--navy);background:var(--off-white);transition:border-color .15s,box-shadow .15s;box-sizing:border-box;}
.field-group input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,27,62,0.09);background:var(--white);}
.auth-btn{width:100%;padding:.82rem;background:var(--navy);color:var(--white);border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.95rem;font-weight:700;cursor:pointer;transition:background .18s;letter-spacing:.02em;}
.auth-btn:hover{background:#0f2347;}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;}
.auth-error{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius-sm);color:#dc2626;font-size:.84rem;padding:.65rem .85rem;margin-bottom:1rem;display:none;}
.auth-error.visible{display:block;}
.auth-success{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius-sm);color:#15803d;font-size:.88rem;padding:1rem;margin-bottom:1rem;display:none;line-height:1.6;}
.auth-success.visible{display:block;}
.auth-switch{text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--text-mid);}
.auth-switch a{color:var(--navy);font-weight:700;text-decoration:none;}
.auth-switch a:hover{text-decoration:underline;}
</style>
</head>
<body class="auth-page">
<div id="site-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="../index.html" class="auth-logo">Equine <span>Edu</span></a>
    <h1 class="auth-heading">Reset your password</h1>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
    <hr class="auth-divider">

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-success" id="auth-success"></div>

    <form id="reset-form" novalidate>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <button type="submit" class="auth-btn" id="submit-btn">Send Reset Link</button>
    </form>

    <p class="auth-switch"><a href="login.html">Back to Log In</a></p>
  </div>
</div>

<div id="site-footer"></div>
<script src="../assets/js/supabase-client.js"></script>
<script>
  window.LAYOUT = {
    homeUrl:    '../index.html',
    coursesUrl: '../courses/index.html'
  };
</script>
<script src="../assets/js/layout.js"></script>
<script>
(function(){
  var form      = document.getElementById('reset-form');
  var submitBtn = document.getElementById('submit-btn');
  var errorBox  = document.getElementById('auth-error');
  var successBox= document.getElementById('auth-success');

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errorBox.classList.remove('visible');
    successBox.classList.remove('visible');

    var email = document.getElementById('email').value.trim();
    if (!email){ errorBox.textContent='Please enter your email.'; errorBox.classList.add('visible'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    var result = await EEAuth.resetPassword(email);

    if (result.error){
      errorBox.textContent = result.error.message || 'Something went wrong. Please try again.';
      errorBox.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
      return;
    }

    successBox.innerHTML = 'Check your email for a password reset link. It may take a minute to arrive.';
    successBox.classList.add('visible');
    form.style.display = 'none';
  });
})();
</script>
</body>
</html>
