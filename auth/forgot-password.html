<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &mdash; Equine Edu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
.auth-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--soft-white);
}
.auth-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.25rem;
}
.auth-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 40px rgba(36, 54, 74,0.10);
  padding: 2.5rem 2.25rem;
  width: 100%;
  max-width: 420px;
}
.auth-logo {
  font-family: var(--font-display);
  font-size: 1.35rem;
  color: var(--heading);
  text-decoration: none;
  display: block;
  text-align: center;
  margin-bottom: 1.75rem;
}
.auth-logo span { color: var(--tan); }
.auth-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--heading);
  margin-bottom: 0.4rem;
  text-align: center;
}
.auth-subtitle {
  color: var(--body-text);
  font-size: 0.88rem;
  text-align: center;
  margin-bottom: 1.75rem;
  line-height: 1.6;
}
.field-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--heading);
  text-transform: uppercase;
  margin-bottom: 0.45rem;
}
.field-input {
  width: 100%;
  padding: 0.7rem 0.9rem;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.93rem;
  color: var(--heading);
  background: var(--soft-white);
  box-sizing: border-box;
  transition: border-color 0.15s;
}
.field-input:focus { outline: none; border-color: var(--heading); background: var(--white); }
.field-wrap { margin-bottom: 1.25rem; }
.error-msg {
  color: #dc2626;
  font-size: 0.84rem;
  margin-bottom: 1rem;
  display: none;
}
.auth-btn {
  display: block;
  width: 100%;
  padding: 0.8rem;
  background: var(--heading);
  color: var(--white);
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: opacity 0.15s;
  box-sizing: border-box;
}
.auth-btn:hover { opacity: 0.88; }
.auth-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.auth-footer {
  text-align: center;
  margin-top: 1.25rem;
  font-size: 0.85rem;
  color: var(--body-text);
}
.auth-footer a { color: var(--heading); font-weight: 600; text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }
.success-state { display: none; text-align: center; }
.success-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
.success-heading {
  font-family: var(--font-display);
  font-size: 1.35rem;
  color: var(--heading);
  margin-bottom: 0.5rem;
}
.success-msg {
  color: var(--body-text);
  font-size: 0.9rem;
  line-height: 1.6;
  margin-bottom: 1.5rem;
}
</style>
</head>
<body class="auth-page">
<div id="site-nav"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="../index.html" class="auth-logo">Equine <span>Edu</span></a>

    <!-- Request form -->
    <div id="form-state">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

      <div class="field-wrap">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="error-msg" id="error-msg"></div>

      <button class="auth-btn" id="submit-btn" onclick="handleSubmit()">Send Reset Link</button>

      <p class="auth-footer">
        Remembered it? <a href="login.html">Back to Log In</a>
      </p>
    </div>

    <!-- Success state -->
    <div class="success-state" id="success-state">
      <div class="success-icon">📬</div>
      <p class="success-heading">Check your email</p>
      <p class="success-msg">We sent a password reset link to <strong id="sent-email"></strong>. Click the link in the email to set a new password.</p>
      <a href="login.html" class="auth-btn" style="text-decoration:none;display:block;text-align:center;">Back to Log In</a>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="../assets/js/supabase-client.js"></script>
<script>
  window.LAYOUT = {
    homeUrl:    '../index.html',
    coursesUrl: '../courses/index.html'
  };
</script>
<script src="../assets/js/layout.js"></script>
<script>
async function handleSubmit() {
  var email = document.getElementById('email').value.trim();
  var btn   = document.getElementById('submit-btn');
  var errEl = document.getElementById('error-msg');

  errEl.style.display = 'none';

  if (!email) {
    errEl.textContent   = 'Please enter your email address.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Sending…';

  try {
    await EEAuth.resetPassword(email, window.location.origin + '/auth/callback.html');
    document.getElementById('form-state').style.display    = 'none';
    document.getElementById('success-state').style.display = '';
    document.getElementById('sent-email').textContent      = email;
  } catch (err) {
    errEl.textContent   = 'Something went wrong. Please try again.';
    errEl.style.display = 'block';
    btn.disabled        = false;
    btn.textContent     = 'Send Reset Link';
  }
}

document.getElementById('email').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') handleSubmit();
});
</script>
</body>
</html>
