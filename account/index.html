<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account &mdash; Equine Edu</title>
<meta name="description" content="Manage your Equine Edu account and subscription.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/course.css">
<style>
.account-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #1a3055 100%);
  padding: 3.5rem 1.5rem 2.5rem;
  text-align: center;
  color: var(--white);
}
.account-hero h1 {
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 4vw, 2.4rem);
  margin-bottom: 0.35rem;
}
.account-hero h1 span { color: var(--gold); }
.account-hero p {
  color: rgba(255,255,255,0.7);
  font-size: 0.92rem;
}
.account-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
}
.account-section {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 1.75rem;
  margin-bottom: 1.25rem;
}
.account-section-title {
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: var(--navy);
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}
.account-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--off-white);
}
.account-row:last-child { border-bottom: none; }
.account-row-label {
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-mid);
  flex-shrink: 0;
  min-width: 110px;
}
.account-row-value {
  font-size: 0.93rem;
  color: var(--navy);
  font-weight: 500;
  flex: 1;
}
.badge {
  display: inline-block;
  padding: 0.2rem 0.65rem;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.badge-free   { background: var(--off-white); color: var(--text-mid); border: 1px solid var(--border); }
.badge-active { background: #d1fae5; color: #065f46; }
.plan-card {
  background: linear-gradient(135deg, #0a1f3a 0%, #1a3055 100%);
  border-radius: var(--radius-lg);
  padding: 1.5rem 1.75rem;
  color: var(--white);
  margin-bottom: 1.25rem;
  position: relative;
  overflow: hidden;
}
.plan-card::after {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 100px; height: 100px;
  background: rgba(201,168,76,0.08);
  border-radius: 50%;
}
.plan-name {
  font-family: var(--font-display);
  font-size: 1.25rem;
  margin-bottom: 0.25rem;
}
.plan-name span { color: var(--gold); }
.plan-desc {
  font-size: 0.84rem;
  color: rgba(255,255,255,0.65);
  margin-bottom: 1.25rem;
  line-height: 1.5;
}
.plan-upgrade-btn {
  display: inline-block;
  background: var(--gold);
  color: var(--navy);
  padding: 0.6rem 1.4rem;
  border-radius: var(--radius-sm);
  font-weight: 800;
  font-size: 0.85rem;
  text-decoration: none;
  letter-spacing: 0.03em;
  transition: opacity 0.15s;
}
.plan-upgrade-btn:hover { opacity: 0.88; }
.signout-btn {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text-mid);
  padding: 0.65rem 1.5rem;
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.signout-btn:hover { border-color: #dc2626; color: #dc2626; }
.loading-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-mid);
  font-size: 0.92rem;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--navy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="site-nav"></div>

<!-- Loading state shown while session check runs -->
<div id="page-loading" class="loading-state">
  <div class="spinner"></div>
  <p>Loading your account…</p>
</div>

<!-- Main content (hidden until loaded) -->
<div id="page-content" style="display:none;">

  <div class="account-hero">
    <h1>My <span>Account</span></h1>
    <p id="hero-greeting">Welcome back!</p>
  </div>

  <div class="account-wrap">

    <!-- Subscription plan card -->
    <div class="plan-card" id="plan-card">
      <div class="plan-name">Free <span>Plan</span></div>
      <p class="plan-desc">Upgrade to unlock all courses, quizzes, horse bowl practice, weekly scenarios, and more.</p>
      <a href="../pricing.html" class="plan-upgrade-btn" id="upgrade-btn">Get Your Barn Pass</a>
    </div>

    <!-- Profile info -->
    <div class="account-section">
      <div class="account-section-title">Profile</div>
      <div class="account-row">
        <span class="account-row-label">Name</span>
        <span class="account-row-value" id="profile-name">—</span>
      </div>
      <div class="account-row">
        <span class="account-row-label">Email</span>
        <span class="account-row-value" id="profile-email">—</span>
      </div>
      <div class="account-row">
        <span class="account-row-label">Plan</span>
        <span class="account-row-value">
          <span class="badge badge-free" id="plan-badge">Free</span>
        </span>
      </div>
      <div class="account-row">
        <span class="account-row-label">Member since</span>
        <span class="account-row-value" id="profile-joined">—</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="account-section">
      <div class="account-section-title">Account</div>
      <div class="account-row">
        <span class="account-row-label">Password</span>
        <span class="account-row-value"><a href="../auth/forgot-password.html" style="color:var(--navy);font-weight:600;text-decoration:none;">Change password →</a></span>
      </div>
    </div>

    <div style="margin-top:1.5rem;">
      <button class="signout-btn" id="signout-btn">Sign Out</button>
    </div>

  </div>
</div>

<div id="site-footer"></div>

<script src="../assets/js/supabase-client.js"></script>
<script>
  window.LAYOUT = {
    homeUrl:    '../index.html',
    coursesUrl: '../courses/index.html'
  };
</script>
<script src="../assets/js/layout.js"></script>
<script>
(function () {

  function showPage(user, profile) {
    document.getElementById('page-loading').style.display = 'none';
    document.getElementById('page-content').style.display = '';

    var displayName = (profile && profile.display_name) || user.email.split('@')[0];
    document.getElementById('hero-greeting').textContent = 'Welcome back, ' + displayName + '!';
    document.getElementById('profile-name').textContent  = displayName;
    document.getElementById('profile-email').textContent = user.email;

    var joined = new Date(user.created_at);
    document.getElementById('profile-joined').textContent = joined.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    // Subscription status
    var tier   = (profile && profile.subscription_tier)   || 'free';
    var status = (profile && profile.subscription_status) || 'free';
    var badge  = document.getElementById('plan-badge');
    var planCard = document.getElementById('plan-card');

    if (tier !== 'free' && status === 'active') {
      badge.textContent = tier.charAt(0).toUpperCase() + tier.slice(1);
      badge.className = 'badge badge-active';
      planCard.querySelector('.plan-name').innerHTML = 'Equine Edu <span>Barn Pass</span>';
      planCard.querySelector('.plan-desc').textContent = 'You have full access to all content. Thank you for supporting Equine Edu!';
      document.getElementById('upgrade-btn').style.display = 'none';
    }
  }

  // Guard: redirect to login if not signed in
  EEAuth.init(async function (session) {
    if (!session) {
      window.location.replace('../auth/login.html?next=/account/index.html');
      return;
    }

    var user    = session.user;
    var profile = await EEAuth.getProfile();
    showPage(user, profile);
  });

  document.getElementById('signout-btn').addEventListener('click', async function () {
    this.textContent = 'Signing out…';
    this.disabled = true;
    await EEAuth.signOut();
    window.location.replace('../index.html');
  });

})();
</script>
</body>
</html>
