<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Term Match &mdash; External Equine Anatomy &mdash; Equine Edu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../../assets/css/core.css">
<link rel="stylesheet" href="../../../../../assets/css/components.css">
<link rel="stylesheet" href="../../../../../assets/css/course.css">
<style>
.game-wrap { max-width: 720px; margin: 0 auto; }

.match-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.82rem; font-weight: 700; color: var(--text-mid); }
.match-status span { color: var(--navy); }
.round-badge { background: var(--off-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.3rem 0.75rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--text-mid); }

/* Two-column layout */
.match-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.match-col-header { font-size: 0.66rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-light); text-align: center; margin-bottom: 0.6rem; }

.match-card {
  background: var(--white);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 0.65rem 0.8rem;
  margin-bottom: 0.45rem;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, opacity 0.2s;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-dark);
  line-height: 1.4;
  min-height: 50px;
  display: flex;
  align-items: center;
}
.match-card.term { font-family: var(--font-display); font-size: 0.95rem; color: var(--navy); justify-content: center; text-align: center; font-weight: 700; }
.match-card:hover:not(.matched):not(.selected):not(.no-hover) { border-color: var(--gold); background: rgba(201,168,76,0.06); }
.match-card.selected { border-color: var(--navy); background: rgba(13,27,62,0.06); }
.match-card.matched { border-color: #2d7a4f; background: #e8f7ef; color: #1a5c38; cursor: default; opacity: 0.7; }
.match-card.matched.term { color: #1a5c38; }
.match-card.wrong-shake { border-color: #c0392b; background: #fdf2f2; animation: shake 0.35s ease; }

@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-6px); }
  40%    { transform: translateX(6px); }
  60%    { transform: translateX(-4px); }
  80%    { transform: translateX(4px); }
}

/* Round result flash */
.round-feedback { text-align: center; font-size: 0.84rem; padding: 0.55rem; border-radius: var(--radius); min-height: 36px; margin-bottom: 0.75rem; display: none; font-weight: 700; }
.round-feedback.show { display: block; }
.round-feedback.correct { background: #e8f7ef; color: #1a5c38; }
.round-feedback.wrong   { background: #fdf2f2; color: #8b1a1a; }

/* Completion */
.result-card { background: var(--navy); color: var(--white); border-radius: var(--radius-lg); padding: 2rem; text-align: center; display: none; }
.result-card.show { display: block; }
.result-big { font-family: var(--font-display); font-size: 3rem; color: var(--gold); }
.result-msg { font-size: 0.95rem; color: rgba(255,255,255,0.8); margin: 1rem 0 1.5rem; line-height: 1.6; }
.restart-btn { background: var(--gold); color: var(--navy); border: none; padding: 0.75rem 1.75rem; border-radius: var(--radius); font-weight: 800; font-size: 0.88rem; cursor: pointer; }

@media (max-width: 520px) {
  .match-columns { grid-template-columns: 1fr; }
  .match-card.term { font-size: 0.85rem; }
}
</style>
</head>
<body>
<div id="site-nav"></div>
<div id="course-breadcrumb"></div>

<section class="lesson-hero" id="top">
  <div class="lesson-hero-inner">
    <div class="lesson-hero-text">
      <div class="lesson-module-tag">External Equine Anatomy</div>
      <h1 class="lesson-hero-title">Term <span>Match</span></h1>
      <p class="lesson-hero-desc">Match each anatomy term to its description. Click a term, then click the description that fits it.</p>
    </div>
  </div>
</section>

<div class="lesson-wrap">
  <main class="lesson-left">
    <div class="game-wrap">

      <div id="game-area">
        <div class="match-status">
          <div>Matched: <span id="matched-count">0</span> / <span id="total-count">0</span></div>
          <div class="round-badge">Round <span id="round-num">1</span></div>
        </div>

        <div class="round-feedback" id="round-feedback"></div>

        <div class="match-columns">
          <div>
            <div class="match-col-header">Terms</div>
            <div id="terms-col"></div>
          </div>
          <div>
            <div class="match-col-header">Descriptions</div>
            <div id="descs-col"></div>
          </div>
        </div>
      </div>

      <div class="result-card" id="result-card">
        <div style="font-size:.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:.25rem;">Complete!</div>
        <div class="result-big" id="result-big"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="restart-btn" onclick="startGame()">Play Again</button>
      </div>

    </div>
  </main>
  <aside class="lesson-right">
    <div id="course-sidebar"></div>
    <div id="course-sidebar-nav"></div>
  </aside>
</div>

<div id="site-footer"></div>

<script>
const ALL_PAIRS = [
  { term:"Poll",           desc:"The highest point of the skull, between the ears" },
  { term:"Foretop",        desc:"The forelock — the mane hair that falls forward between the ears" },
  { term:"Crest",          desc:"The topline ridge running along the top of the neck" },
  { term:"Mane",           desc:"The long hair that grows along the crest of the neck" },
  { term:"Withers",        desc:"The highest point of the back, where horse height is measured" },
  { term:"Back",           desc:"The topline between the withers and the loin" },
  { term:"Loin",           desc:"The topline between the last rib and the croup" },
  { term:"Croup",          desc:"The rounded top of the hindquarters, from hip to tail" },
  { term:"Dock",           desc:"The bony, muscular upper part of the tail" },
  { term:"Point of Hip",   desc:"The bony prominence on the side of the pelvis" },
  { term:"Barrel",         desc:"The rounded rib cage between the forelegs and the flank" },
  { term:"Flank",          desc:"The soft area just behind the last rib and in front of the hind leg" },
  { term:"Heart Girth",    desc:"The circumference of the body just behind the elbow and withers" },
  { term:"Throatlatch",    desc:"Where the underside of the jaw meets the top of the neck" },
  { term:"Jugular Groove", desc:"The channel along the lower side of the neck where the jugular vein runs" },
  { term:"Point of Shoulder", desc:"The forward bony prominence at the top of the front leg" },
  { term:"Muzzle",         desc:"The lower face including the lips, nostrils, and chin" },
  { term:"Jaw",            desc:"The lower bony structure of the head that frames the cheek and chin" },
  { term:"Chin Groove",    desc:"The groove on the underside of the lower jaw between the two jaw bones" },
  { term:"Stifle",         desc:"The large upper hind leg joint, equivalent to the human knee" },
  { term:"Gaskin",         desc:"The muscular region between the stifle and the hock" },
  { term:"Hock",           desc:"The large angled joint of the hind leg, equivalent to the human ankle" },
  { term:"Cannon Bone",    desc:"The large bone of the lower leg between the knee (or hock) and the fetlock" },
  { term:"Fetlock",        desc:"The prominent joint between the cannon bone and the pastern" },
  { term:"Pastern",        desc:"The sloping section between the fetlock and the hoof" },
  { term:"Coronet Band",   desc:"The band of tissue at the top of the hoof where the hoof wall grows from" },
  { term:"Chestnut",       desc:"A small oval horn-like vestigial growth on the inside of each leg" },
  { term:"Ergot",          desc:"A small vestigial horn growth at the back of the fetlock" },
  { term:"Elbow",          desc:"The upper joint of the front leg, where the forearm meets the body" },
  { term:"Forearm",        desc:"The region of the front leg between the elbow and the knee" },
  { term:"Knee",           desc:"The joint of the front leg between the forearm and the cannon bone" },
  { term:"Thigh",          desc:"The muscular upper section of the hind leg, above the stifle" },
  { term:"Buttock",        desc:"The rounded muscular area at the back of the hindquarters" },
  { term:"Hoof",           desc:"The hard outer covering that protects the foot" }
];

const ROUND_SIZE = 5;
const POOL_SIZE  = 10;
let rounds = [], roundIdx = 0, correct = 0, attempts = 0, poolSize = POOL_SIZE;
let selectedTerm = null, selectedDesc = null;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startGame() {
  const pool = shuffle([...ALL_PAIRS]).slice(0, POOL_SIZE);
  poolSize = pool.length;
  rounds = [];
  for (let i = 0; i < pool.length; i += ROUND_SIZE) {
    rounds.push(pool.slice(i, i + ROUND_SIZE));
  }
  roundIdx = 0; correct = 0; attempts = 0;
  selectedTerm = null; selectedDesc = null;
  document.getElementById('result-card').classList.remove('show');
  document.getElementById('game-area').style.display = '';
  document.getElementById('total-count').textContent = poolSize;
  loadRound();
}

function loadRound() {
  if (roundIdx >= rounds.length) { endGame(); return; }
  selectedTerm = null; selectedDesc = null;
  const pairs = rounds[roundIdx];
  const descShuffled = shuffle([...pairs]);

  const fb = document.getElementById('round-feedback');
  fb.className = 'round-feedback'; fb.textContent = '';

  document.getElementById('round-num').textContent = roundIdx + 1;
  document.getElementById('matched-count').textContent = correct;

  const termsCol = document.getElementById('terms-col');
  const descsCol = document.getElementById('descs-col');
  termsCol.innerHTML = ''; descsCol.innerHTML = '';

  pairs.forEach(function(pair) {
    const tc = document.createElement('div');
    tc.className = 'match-card term';
    tc.dataset.id = pair.term;
    tc.dataset.type = 'term';
    tc.textContent = pair.term;
    tc.addEventListener('click', function() { onCardClick(tc); });
    termsCol.appendChild(tc);
  });

  descShuffled.forEach(function(pair) {
    const dc = document.createElement('div');
    dc.className = 'match-card';
    dc.dataset.id = pair.term;
    dc.dataset.type = 'desc';
    dc.textContent = pair.desc;
    dc.addEventListener('click', function() { onCardClick(dc); });
    descsCol.appendChild(dc);
  });

  // Match row heights so each term/desc pair aligns
  requestAnimationFrame(function() {
    var termCards = Array.from(termsCol.querySelectorAll('.match-card'));
    var descCards = Array.from(descsCol.querySelectorAll('.match-card'));
    termCards.forEach(function(c){ c.style.height = ''; });
    descCards.forEach(function(c){ c.style.height = ''; });
    for (var i = 0; i < termCards.length; i++) {
      var h = Math.max(termCards[i].offsetHeight, descCards[i].offsetHeight);
      termCards[i].style.height = h + 'px';
      descCards[i].style.height = h + 'px';
    }
  });
}

function onCardClick(card) {
  if (card.classList.contains('matched')) return;

  const type = card.dataset.type;

  if (type === 'term') {
    // Deselect old term selection
    document.querySelectorAll('.match-card.term.selected').forEach(function(c){ c.classList.remove('selected'); });
    selectedTerm = card;
    card.classList.add('selected');
  } else {
    // Deselect old desc selection
    document.querySelectorAll('.match-card[data-type="desc"].selected').forEach(function(c){ c.classList.remove('selected'); });
    selectedDesc = card;
    card.classList.add('selected');
  }

  if (selectedTerm && selectedDesc) {
    checkMatch();
  }
}

function checkMatch() {
  const termId = selectedTerm.dataset.id;
  const descId = selectedDesc.dataset.id;
  attempts++;

  const fb = document.getElementById('round-feedback');

  if (termId === descId) {
    correct++;
    selectedTerm.classList.remove('selected'); selectedTerm.classList.add('matched');
    selectedDesc.classList.remove('selected'); selectedDesc.classList.add('matched');
    fb.className = 'round-feedback correct show';
    fb.textContent = '✓ Correct!';
    document.getElementById('matched-count').textContent = correct;
    selectedTerm = null; selectedDesc = null;

    // Check if whole round is complete
    const allMatched = Array.from(document.querySelectorAll('.match-card.term')).every(function(c){ return c.classList.contains('matched'); });
    if (allMatched) {
      setTimeout(function() {
        roundIdx++;
        loadRound();
      }, 500);
    }
  } else {
    fb.className = 'round-feedback wrong show';
    fb.textContent = '✗ Not a match — try again.';
    const t = selectedTerm, d = selectedDesc;
    t.classList.remove('selected'); d.classList.remove('selected');
    t.classList.add('wrong-shake'); d.classList.add('wrong-shake');
    setTimeout(function() {
      t.classList.remove('wrong-shake'); d.classList.remove('wrong-shake');
    }, 400);
    selectedTerm = null; selectedDesc = null;
  }
}

function endGame() {
  document.getElementById('game-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.classList.add('show');
  const accuracy = Math.round((correct / Math.max(attempts, 1)) * 100);
  document.getElementById('result-big').textContent = accuracy + '%';
  const msgs = [
    'Keep at it — every attempt helps you remember more.',
    'Good start! Another round will help lock in the terms.',
    'Solid matching — you are building a solid vocabulary.',
    'Great accuracy! You clearly know the structure descriptions.',
    'Excellent — you matched every term correctly on the first try!'
  ];
  const msgIdx = accuracy >= 95 ? 4 : accuracy >= 80 ? 3 : accuracy >= 65 ? 2 : accuracy >= 50 ? 1 : 0;
  document.getElementById('result-msg').textContent = 'Accuracy: ' + accuracy + '% over ' + poolSize + ' matched pairs. ' + msgs[msgIdx];
}

startGame();
</script>
