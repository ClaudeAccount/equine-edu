<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Label the Horse &mdash; Equine Anatomy &mdash; Equine Edu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
.game-wrap { max-width: 760px; margin: 0 auto; }

/* ===== Tab Bar (face-markings style) ===== */
.tab-bar {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.35rem;
  padding: 0.4rem;
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 1.25rem;
}
.tab-btn {
  min-height: 44px;
  border: 2px solid transparent;
  border-radius: calc(var(--radius) - 2px);
  background: rgba(13,27,62,0.08);
  color: rgba(13,27,62,0.45);
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.25;
  padding: 0.6rem 0.3rem;
  transition: background 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s, opacity 0.18s;
}
.tab-btn:nth-child(2) {
  background: rgba(201,168,76,0.12);
  color: rgba(145,108,26,0.62);
}
.tab-btn.active {
  background: var(--navy);
  color: var(--gold);
  border-color: var(--navy);
  font-weight: 800;
  box-shadow: 0 5px 18px rgba(13,27,62,0.2);
}
.tab-btn:nth-child(2).active {
  background: var(--gold);
  color: var(--navy);
  border-color: var(--gold);
  box-shadow: 0 5px 18px rgba(201,168,76,0.28);
}
.tab-btn:not(.active):hover { opacity: 0.85; color: var(--navy); }
.tab-btn.tab-done::after { content: ' ✓'; font-size: 0.68em; opacity: 0.85; }

/* ===== Score Bar ===== */
.score-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.9rem;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-mid);
}
.score-bar span { color: var(--navy); }
.region-badge {
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.28rem 0.7rem;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-mid);
}

/* ===== Diagram ===== */
.diagram-outer { display: flex; justify-content: center; padding: 0.35rem 0; }
.diagram-wrap {
  position: relative;
  display: inline-block;
  width: 100%;
  max-width: 680px;
  user-select: none;
  background: linear-gradient(160deg,#d8dce8 0%,#cdd3e4 100%);
  border-radius: var(--radius);
  border: 1px solid rgba(13,27,62,0.18);
  box-shadow: 0 8px 32px rgba(13,27,62,0.15);
}
.diagram-wrap img { width: 100%; display: block; border-radius: var(--radius); }

/* Drop zones — visible target circles */
.drop-zone {
  position: absolute;
  width: 22px;
  height: 22px;
  border: 2px solid rgba(37,99,235,0.82);
  border-radius: 50%;
  background: rgba(37,99,235,0.14);
  transform: translate(-50%,-50%);
  z-index: 4;
  cursor: crosshair;
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.55);
}
.drop-zone::after {
  content: '';
  width: 6px;
  height: 6px;
  background: rgba(37,99,235,0.9);
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(255,255,255,0.7);
}

/* When a label pill is selected, pulse the empty drop zones */
body.pill-selected .drop-zone:not(.correct) {
  border-color: rgb(37,99,235);
  background: rgba(37,99,235,0.22);
  animation: dzPulse 1.2s ease infinite;
}
@keyframes dzPulse {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50%      { transform: translate(-50%,-50%) scale(1.18); }
}

.drop-zone.drag-over {
  background: rgba(13,27,62,0.45);
  border-color: var(--navy);
  border-style: solid;
  transform: translate(-50%,-50%) scale(1.25);
}
.drop-zone.drag-over::after { background: var(--gold); }

/* Correct: expand into a labeled pill */
.drop-zone.correct {
  width: auto;
  height: auto;
  min-width: 22px;
  padding: 0.22rem 0.6rem;
  border-radius: 999px;
  border: 2px solid #2d7a4f;
  border-style: solid;
  background: rgba(45,122,79,0.82);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #e8f7ef;
  white-space: nowrap;
  transform: translate(-50%,-50%);
  cursor: default;
  pointer-events: none;
  animation: none;
}
.drop-zone.correct::after { display: none; }

/* Wrong flash */
.drop-zone.wrong-flash {
  border-color: #c0392b;
  border-style: solid;
  background: rgba(192,57,43,0.22);
  animation: dzShake 0.38s ease;
}
@keyframes dzShake {
  0%,100% { transform: translate(-50%,-50%); }
  20%     { transform: translate(calc(-50% - 6px),-50%); }
  40%     { transform: translate(calc(-50% + 6px),-50%); }
  60%     { transform: translate(calc(-50% - 3px),-50%); }
  80%     { transform: translate(calc(-50% + 3px),-50%); }
}

/* ===== Label Bank ===== */
.label-bank-wrap {
  margin-top: 1.1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--off-white);
  padding: 0.85rem 0.9rem 0.75rem;
}
.label-bank-header {
  font-size: 0.63rem;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--text-light);
  margin-bottom: 0.6rem;
}
.label-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.label-pill {
  background: var(--navy);
  color: var(--gold);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.3rem 0.75rem;
  border-radius: 999px;
  cursor: grab;
  border: 2px solid transparent;
  transition: opacity 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  touch-action: none;
  user-select: none;
  white-space: nowrap;
  line-height: 1.6;
}
.label-pill:hover:not(.used) { opacity: 0.82; }
.label-pill.selected {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.28);
  transform: scale(1.06);
}
.label-pill.used {
  opacity: 0.22;
  pointer-events: none;
  cursor: default;
  text-decoration: line-through;
}
.label-pill.dragging { opacity: 0.35; cursor: grabbing; }

/* Drag ghost */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  background: var(--navy);
  color: var(--gold);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 0.3rem 0.75rem;
  border-radius: 999px;
  border: 2px solid var(--gold);
  box-shadow: 0 6px 20px rgba(13,27,62,0.45);
  z-index: 9999;
  white-space: nowrap;
  transform: translate(-50%,-50%);
  line-height: 1.6;
}

/* ===== Feedback ===== */
.game-feedback {
  font-size: 0.82rem;
  font-weight: 700;
  text-align: center;
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius);
  min-height: 36px;
  margin-top: 0.6rem;
  display: none;
}
.game-feedback.show { display: block; }
.game-feedback.correct { background: #e8f7ef; color: #1a5c38; }
.game-feedback.wrong   { background: #fdf2f2; color: #8b1a1a; }

/* ===== Region Complete ===== */
.region-complete {
  background: var(--navy);
  color: var(--white);
  border-radius: var(--radius-lg);
  padding: 1.75rem;
  text-align: center;
  display: none;
  margin-top: 1.1rem;
}
.region-complete.show { display: block; }
.rc-big {
  font-family: var(--font-display);
  font-size: 2.5rem;
  color: var(--gold);
  margin-bottom: 0.15rem;
}
.rc-label {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.65rem;
}
.rc-msg {
  font-size: 0.88rem;
  color: rgba(255,255,255,0.75);
  margin: 0 0 1.25rem;
  line-height: 1.65;
}
.rc-actions {
  display: flex;
  gap: 0.65rem;
  justify-content: center;
  flex-wrap: wrap;
}
.rc-btn {
  padding: 0.7rem 1.5rem;
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 0.84rem;
  border: none;
  cursor: pointer;
}
.rc-btn-primary   { background: var(--gold); color: var(--navy); }
.rc-btn-secondary { background: rgba(255,255,255,0.1); color: var(--white); border: 1px solid rgba(255,255,255,0.2); }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .tab-bar { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 360px) {
  .tab-bar { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
/* ===========================================================================

   Positions match DIAGRAM_DEFS from 3-equine-anatomy.html.
=========================================================================== */

/* ---- State ---- */
var regionState      = {};   // regionKey → Set of placed part ids
var currentIdx       = 0;
var selectedPill     = null; // { id, text } currently click-selected
var ghost            = null; // ghost div during pointer drag
var dragPart         = null; // part being dragged
var dragPillEl       = null; // pill DOM element being dragged
var feedbackTimer    = null;
var edgeScrollRaf    = null; // requestAnimationFrame id for edge scroll
var edgeScrollVY     = 0;    // current vertical scroll speed (px/frame)

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ================================================================
   RENDER
================================================================ */

function initTabs() {
  var bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  REGIONS.forEach(function(r, i) {
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === currentIdx ? ' active' : '');
    var placed = regionState[r.key];
    if (placed && placed.size === r.parts.length) btn.classList.add('tab-done');
    btn.textContent = r.label;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === currentIdx ? 'true' : 'false');
    btn.addEventListener('click', function() { switchRegion(i); });
    bar.appendChild(btn);
  });
}

function renderDiagram() {
  var r    = REGIONS[currentIdx];
  var wrap = document.getElementById('diagram-wrap');
  var img  = document.getElementById('diagram-img');

  // Remove old drop zones
  wrap.querySelectorAll('.drop-zone').forEach(function(el) { el.remove(); });

  img.src = r.img;
  img.alt = r.label + ' — label the structures';

  if (!regionState[r.key]) regionState[r.key] = new Set();
  var placed = regionState[r.key];

  r.parts.forEach(function(part) {
    var dz = document.createElement('div');
    dz.className = 'drop-zone' + (placed.has(part.id) ? ' correct' : '');
    dz.dataset.id = part.id;
    dz.style.left = part.ax + '%';
    dz.style.top  = part.ay + '%';
    if (placed.has(part.id)) dz.textContent = part.text;

    dz.addEventListener('click', function(e) {
      e.stopPropagation();
      onDropZoneClick(part);
    });
    wrap.appendChild(dz);
  });
}

function renderLabelBank() {
  var r      = REGIONS[currentIdx];
  var placed = regionState[r.key] || new Set();
  var bank   = document.getElementById('label-bank');
  bank.innerHTML = '';

  shuffle([...r.parts]).forEach(function(part) {
    var pill = document.createElement('div');
    pill.className  = 'label-pill';
    pill.dataset.id = part.id;
    pill.textContent = part.text;
    if (placed.has(part.id)) pill.classList.add('used');
    if (selectedPill && selectedPill.id === part.id) pill.classList.add('selected');

    pill.addEventListener('click', function(e) {
      e.stopPropagation();
      onPillClick(part, pill);
    });
    pill.addEventListener('pointerdown', function(e) {
      if (pill.classList.contains('used')) return;
      onPillPointerDown(e, part, pill);
    }, { passive: false });

    bank.appendChild(pill);
  });
}

function updateScore() {
  var r = REGIONS[currentIdx];
  var placed = regionState[r.key] ? regionState[r.key].size : 0;
  document.getElementById('placed-count').textContent = placed;
  document.getElementById('total-count').textContent  = r.parts.length;
  document.getElementById('region-badge').textContent = r.label;
}

function switchRegion(idx) {
  currentIdx   = idx;
  selectedPill = null;
  document.body.classList.remove('pill-selected');
  hideFeedback();
  document.getElementById('region-complete').classList.remove('show');
  initTabs();
  renderDiagram();
  renderLabelBank();
  updateScore();
}

/* ================================================================
   CLICK-TO-SELECT + CLICK-TO-PLACE
================================================================ */

function onPillClick(part, pillEl) {
  if (pillEl.classList.contains('used')) return;

  if (selectedPill && selectedPill.id === part.id) {
    selectedPill = null;
    document.body.classList.remove('pill-selected');
  } else {
    selectedPill = part;
    document.body.classList.add('pill-selected');
  }
  updatePillSelection();
}

function onDropZoneClick(part) {
  if (!selectedPill) return;
  var r = REGIONS[currentIdx];
  if (regionState[r.key] && regionState[r.key].has(part.id)) return;
  attemptPlace(selectedPill.id, part.id, true);
  selectedPill = null;
  document.body.classList.remove('pill-selected');
  updatePillSelection();
}

function updatePillSelection() {
  document.querySelectorAll('.label-pill').forEach(function(p) {
    p.classList.toggle('selected', !!(selectedPill && p.dataset.id === selectedPill.id));
  });
}

/* ================================================================
   DRAG VIA POINTER EVENTS
================================================================ */

function onPillPointerDown(e, part, pillEl) {
  var moved  = false;
  var startX = e.clientX;
  var startY = e.clientY;

  // Pre-select this pill
  selectedPill = part;
  document.body.classList.add('pill-selected');
  updatePillSelection();

  function onMove(ev) {
    var dx = ev.clientX - startX;
    var dy = ev.clientY - startY;

    if (!moved && Math.sqrt(dx * dx + dy * dy) > 6) {
      moved      = true;
      dragPart   = part;
      dragPillEl = pillEl;
      pillEl.classList.add('dragging');

      ghost = document.createElement('div');
      ghost.className  = 'drag-ghost';
      ghost.textContent = part.text;
      document.body.appendChild(ghost);
    }

    if (moved && ghost) {
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top  = ev.clientY + 'px';

      // Highlight nearest drop zone
      var hit = dropZoneAtPoint(ev.clientX, ev.clientY);
      document.querySelectorAll('.drop-zone').forEach(function(z) { z.classList.remove('drag-over'); });
      if (hit && !hit.classList.contains('correct')) hit.classList.add('drag-over');

      // Edge-scroll: activate when pointer is within 90px of viewport top/bottom
      var EDGE = 90;
      var MAX  = 14; // max px per animation frame
      var vy   = ev.clientY;
      var wh   = window.innerHeight;
      if (vy < EDGE) {
        edgeScrollVY = -MAX * (1 - vy / EDGE);
      } else if (vy > wh - EDGE) {
        edgeScrollVY = MAX * ((vy - (wh - EDGE)) / EDGE);
      } else {
        edgeScrollVY = 0;
      }
      if (edgeScrollVY !== 0 && !edgeScrollRaf) {
        edgeScrollRaf = requestAnimationFrame(runEdgeScroll);
      }
    }
    ev.preventDefault();
  }

  function onUp(ev) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup',   onUp);

    // Stop edge scroll
    edgeScrollVY = 0;
    if (edgeScrollRaf) { cancelAnimationFrame(edgeScrollRaf); edgeScrollRaf = null; }

    document.querySelectorAll('.drop-zone').forEach(function(z) { z.classList.remove('drag-over'); });

    if (ghost)   { ghost.remove(); ghost = null; }
    if (dragPillEl) dragPillEl.classList.remove('dragging');

    if (moved && dragPart) {
      var hit = dropZoneAtPoint(ev.clientX, ev.clientY);
      if (hit && !hit.classList.contains('correct')) {
        attemptPlace(dragPart.id, hit.dataset.id, false);
        selectedPill = null;
        document.body.classList.remove('pill-selected');
        updatePillSelection();
      }
    }

    dragPart   = null;
    dragPillEl = null;
    moved      = false;
  }

  document.addEventListener('pointermove', onMove, { passive: false });
  document.addEventListener('pointerup',   onUp);
  e.preventDefault();
}

/* Continuous edge-scroll loop — runs while edgeScrollVY !== 0 */
function runEdgeScroll() {
  if (edgeScrollVY === 0 || !dragPart) {
    edgeScrollRaf = null;
    return;
  }
  window.scrollBy(0, edgeScrollVY);
  edgeScrollRaf = requestAnimationFrame(runEdgeScroll);
}

/* Find the drop zone whose center is closest to (x,y) within hit radius */
function dropZoneAtPoint(x, y) {
  var zones  = document.querySelectorAll('.drop-zone:not(.correct)');
  var best   = null;
  var bestD  = Infinity;
  var HIT_R  = 44; // px radius — generous touch target

  zones.forEach(function(dz) {
    var rect = dz.getBoundingClientRect();
    var cx   = rect.left + rect.width  / 2;
    var cy   = rect.top  + rect.height / 2;
    var d    = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
    if (d < HIT_R && d < bestD) { best = dz; bestD = d; }
  });

  return best;
}

/* ================================================================
   PLACE LOGIC
================================================================ */

function attemptPlace(pillId, zoneId, fromClick) {
  var r = REGIONS[currentIdx];
  if (!regionState[r.key]) regionState[r.key] = new Set();

  var dz = document.querySelector('.drop-zone[data-id="' + zoneId + '"]');

  if (pillId === zoneId) {
    // ✓ Correct
    regionState[r.key].add(pillId);
    var partText = r.parts.find(function(p) { return p.id === pillId; }).text;

    if (dz) {
      dz.classList.remove('wrong-flash');
      dz.classList.add('correct');
      dz.textContent = partText;
    }
    var pill = document.querySelector('.label-bank .label-pill[data-id="' + pillId + '"]');
    if (pill) pill.classList.add('used');

    showFeedback('correct', '✓ ' + partText);
    updateScore();
    initTabs(); // refresh checkmarks

    if (regionState[r.key].size === r.parts.length) {
      setTimeout(showRegionComplete, 650);
    }
  } else {
    // ✗ Wrong
    if (dz) {
      dz.classList.add('wrong-flash');
      setTimeout(function() { dz.classList.remove('wrong-flash'); }, 420);
    }
    showFeedback('wrong', '✗ Not quite — try a different dot.');
  }
}

/* ================================================================
   FEEDBACK
================================================================ */

function showFeedback(type, msg) {
  clearTimeout(feedbackTimer);
  var fb = document.getElementById('game-feedback');
  fb.className    = 'game-feedback ' + type + ' show';
  fb.textContent  = msg;
  feedbackTimer   = setTimeout(function() { fb.className = 'game-feedback'; }, 2200);
}

function hideFeedback() {
  clearTimeout(feedbackTimer);
  document.getElementById('game-feedback').className = 'game-feedback';
}

/* ================================================================
   REGION COMPLETE
================================================================ */

function showRegionComplete() {
  var r  = REGIONS[currentIdx];
  var rc = document.getElementById('region-complete');
  rc.classList.add('show');

  document.getElementById('rc-region-name').textContent = r.label;

  var next = currentIdx + 1;
  var nextBtn = document.getElementById('rc-next-btn');

  if (next < REGIONS.length) {
    nextBtn.textContent = 'Next: ' + REGIONS[next].label + ' →';
    nextBtn.style.display = '';
    nextBtn.onclick = function() { switchRegion(next); };
    document.getElementById('rc-msg').textContent = 'Every structure placed correctly. Ready for the next region?';
  } else {
    nextBtn.textContent = 'All Done ✓';
    nextBtn.onclick = null;
    nextBtn.style.display = '';
    document.getElementById('rc-msg').textContent = 'You have labeled all five regions. That is the complete anatomy of the horse.';
  }

  document.getElementById('rc-reset-btn').onclick = function() {
    regionState[r.key] = new Set();
    switchRegion(currentIdx);
  };
}

/* ================================================================
   INIT
================================================================ */
switchRegion(0);
