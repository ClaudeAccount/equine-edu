<script>
/* ═══════════════════════════════════════════════════════════════
   COLOR IDENTIFICATION CHALLENGE — Game Logic
   ═══════════════════════════════════════════════════════════════ */

var COLORS = [
  { name: 'Chestnut',        img: '../../images/common-horse-colors/chestnut.png',         group: 'Base Coat Colors' },
  { name: 'Sorrel',          img: '../../images/common-horse-colors/sorrel.png',           group: 'Base Coat Colors' },
  { name: 'Liver Chestnut',  img: '../../images/common-horse-colors/liver-chestnut.png',   group: 'Base Coat Colors' },
  { name: 'Flaxen Chestnut', img: '../../images/common-horse-colors/flaxen-chestnut.png',  group: 'Base Coat Colors' },
  { name: 'Black',           img: '../../images/common-horse-colors/black.png',            group: 'Base Coat Colors' },
  { name: 'Bay',             img: '../../images/common-horse-colors/bay.png',              group: 'Base Coat Colors' },
  { name: 'Palomino',        img: '../../images/common-horse-colors/palomino.png',         group: 'Golden & Lightened' },
  { name: 'Buckskin',        img: '../../images/common-horse-colors/buckskin.png',         group: 'Golden & Lightened' },
  { name: 'Gray',            img: '../../images/common-horse-colors/gray.png',             group: 'Gray' },
  { name: 'Dapple Gray',     img: '../../images/common-horse-colors/dapple-gray.png',      group: 'Gray' },
  { name: 'Flea-Bitten Gray',img: '../../images/common-horse-colors/flea-bitten-gray.png', group: 'Gray' },
  { name: 'Rose Gray',       img: '../../images/common-horse-colors/rose-gray.png',        group: 'Gray' },
  { name: 'Strawberry Roan', img: '../../images/common-horse-colors/strawberry-roan.png',  group: 'Roan' },
  { name: 'Blue Roan',       img: '../../images/common-horse-colors/blue-roan.png',        group: 'Roan' },
  { name: 'Bay Roan',        img: '../../images/common-horse-colors/bay-roan.png',         group: 'Roan' },
  { name: 'Tobiano',         img: '../../images/common-horse-colors/tobiano.png',          group: 'Patterned' },
  { name: 'Overo',           img: '../../images/common-horse-colors/overo.png',            group: 'Patterned' },
  { name: 'Leopard Appaloosa',         img: '../../images/common-horse-colors/leopard-appaloosa.png',group: 'Patterned' },
  { name: 'Blanket Appaloosa',         img: '../../images/common-horse-colors/blanket-appaloosa.png',group: 'Patterned' }
];

var ROUNDS       = 10;
var state        = {};

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildRounds() {
  var pool = shuffle(COLORS).slice(0, ROUNDS);
  return pool.map(function(correct) {
    var wrong = shuffle(COLORS.filter(function(c){ return c.name !== correct.name; })).slice(0, 3);
    var choices = shuffle([correct].concat(wrong));
    return { correct: correct, choices: choices };
  });
}

function startGame() {
  state = {
    rounds:    buildRounds(),
    current:   0,
    score:     0,
    answered:  false,
    history:   []
  };
  document.getElementById('results-screen').classList.remove('visible');
  document.getElementById('progress-row').style.display = '';
  document.getElementById('photo-wrap').style.display   = '';
  document.getElementById('answer-grid').style.display  = '';
  renderRound();
}

function renderRound() {
  var round   = state.rounds[state.current];
  var roundNo = state.current + 1;
  state.answered = false;

  /* Progress */
  document.getElementById('progress-fill').style.width = ((state.current / ROUNDS) * 100) + '%';
  document.getElementById('round-label').textContent   = 'Round ' + roundNo + ' of ' + ROUNDS;
  document.getElementById('score-display').textContent = state.score;

  /* Photo */
  var img     = document.getElementById('horse-photo');
  var loading = document.getElementById('photo-loading');
  var overlay = document.getElementById('photo-overlay');
  overlay.className = 'challenge-photo-overlay';
  img.style.display = 'none';
  loading.style.display = 'flex';
  img.src = round.correct.img;

  /* Choices */
  var grid = document.getElementById('answer-grid');
  grid.innerHTML = '';
  round.choices.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className   = 'answer-btn';
    btn.textContent = c.name;
    btn.onclick     = function(){ handleAnswer(c.name, round.correct.name); };
    grid.appendChild(btn);
  });

  /* Feedback */
  hideFeedback();
}

function photoLoaded() {
  document.getElementById('photo-loading').style.display = 'none';
  document.getElementById('horse-photo').style.display   = 'block';
}
function photoError() {
  document.getElementById('photo-loading').textContent = 'Image not found';
}

function handleAnswer(chosen, correct) {
  if (state.answered) return;
  state.answered = true;

  var isCorrect = chosen === correct;
  if (isCorrect) state.score++;
  state.history.push({ correct: correct, chosen: chosen, isCorrect: isCorrect });

  /* Color all buttons */
  var btns = document.getElementById('answer-grid').querySelectorAll('.answer-btn');
  btns.forEach(function(btn) {
    btn.disabled = true;
    if (btn.textContent === correct) {
      btn.classList.add(isCorrect ? 'correct' : 'reveal');
    } else if (btn.textContent === chosen && !isCorrect) {
      btn.classList.add('wrong');
    }
  });

  /* Photo overlay */
  document.getElementById('photo-overlay').className = 'challenge-photo-overlay ' + (isCorrect ? 'correct' : 'wrong');

  /* Feedback bar */
  var fb   = document.getElementById('feedback-bar');
  var text = document.getElementById('feedback-text');
  fb.className = 'challenge-feedback ' + (isCorrect ? 'correct' : 'wrong');
  text.textContent = isCorrect
    ? '✓ Correct! That is a ' + correct + '.'
    : '✗ Not quite — this is a ' + correct + '.';

  /* Last round: change button label */
  if (state.current === ROUNDS - 1) {
    document.getElementById('next-btn').textContent = 'See Results →';
  }
}

function hideFeedback() {
  var fb = document.getElementById('feedback-bar');
  fb.className = 'challenge-feedback hidden';
}

function nextRound() {
  state.current++;
  if (state.current >= ROUNDS) {
    showResults();
  } else {
    renderRound();
  }
}

function showResults() {
  /* Hide game elements */
  document.getElementById('progress-row').style.display  = 'none';
  document.getElementById('photo-wrap').style.display    = 'none';
  document.getElementById('answer-grid').style.display   = 'none';
  hideFeedback();

  var s   = state.score;
  var pct = s / ROUNDS;
  var trophy, label, msg;

  if (pct === 1) {
    trophy = '🏆'; label = 'Perfect Score!';
    msg = 'A clean ten out of ten — you know your horse coat colors. Excellent work.';
  } else if (pct >= 0.8) {
    trophy = '🥇'; label = 'Great job!';
    msg = 'Strong result. A few colors tripped you up — review those and try again for a perfect score.';
  } else if (pct >= 0.6) {
    trophy = '🥈'; label = 'Good effort!';
    msg = 'Solid base coat color understanding. Keep practicing — the trickier colors will start to click with a bit more review.';
  } else {
    trophy = '📚'; label = 'Keep practicing!';
    msg = 'This is a good challenge. Go back to the lessons, then come back and try again — you will improve quickly.';
  }

  document.getElementById('results-trophy').textContent       = trophy;
  document.getElementById('results-score-big').textContent    = s + ' / ' + ROUNDS;
  document.getElementById('results-score-label').textContent  = label;
  document.getElementById('results-message').textContent      = msg;
  document.getElementById('score-display').textContent        = s;
  document.getElementById('progress-fill').style.width        = '100%';
  document.getElementById('round-label').textContent          = 'Complete!';

  /* Review list */
  var container = document.getElementById('review-items');
  container.innerHTML = '';
  state.history.forEach(function(h, i) {
    var div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML =
      '<div class="review-dot ' + (h.isCorrect ? 'correct' : 'wrong') + '"></div>' +
      '<span class="review-color-name">Round ' + (i+1) + ': ' + h.correct + '</span>' +
      '<span class="review-answer">' + (h.isCorrect ? '✓ Correct' : 'You said: ' + h.chosen) + '</span>';
    container.appendChild(div);
  });

  document.getElementById('results-screen').classList.add('visible');
}

function restartGame() {
  document.getElementById('progress-row').style.display = '';
  document.getElementById('photo-wrap').style.display   = '';
  document.getElementById('answer-grid').style.display  = '';
  startGame();
}

/* Expose for HTML onclick */
window.nextRound    = nextRound;
window.restartGame  = restartGame;
window.photoLoaded  = photoLoaded;
window.photoError   = photoError;

/* Boot */
startGame();
</script>
