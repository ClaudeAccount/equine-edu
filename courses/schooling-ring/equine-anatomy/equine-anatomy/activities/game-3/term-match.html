<script>
EEGames.mount({
  el: '#game',
  type: 'match',
  rounds: 6,
  progressKey: 'equineEduProgress.equineAnatomy.trainingBarn',
  data: {
    pairs: [
      ['Poll', 'The highest point of the skull, between the ears.'],
      ['Forelock', 'The mane hair that falls forward between the ears.'],
      ['Crest', 'The topline ridge running along the top of the neck.'],
      ['Mane', 'The long hair that grows along the crest of the neck.'],
      ['Withers', 'The highest point of the back, where horse height is measured.'],
      ['Back', 'The topline between the withers and the loin.'],
      ['Loin', 'The topline between the last rib and the croup.'],
      ['Croup', 'The rounded top of the hindquarters, from hip to tail.'],
      ['Dock', 'The bony, muscular upper part of the tail.'],
      ['Point of Hip', 'The bony prominence on the side of the pelvis.'],
      ['Barrel', 'The rounded rib cage between the forelegs and the flank.'],
      ['Flank', 'The soft area just behind the last rib, in front of the hind leg.'],
      ['Heart Girth', 'The body circumference just behind the elbow and withers.'],
      ['Throatlatch', 'Where the underside of the jaw meets the top of the neck.'],
      ['Jugular Groove', 'The channel along the lower neck where the jugular vein runs.'],
      ['Point of Shoulder', 'The forward bony prominence at the top of the front leg.'],
      ['Muzzle', 'The lower face including the lips, nostrils, and chin.'],
      ['Stifle', 'The large upper hind leg joint, like the human knee.'],
      ['Gaskin', 'The muscular region between the stifle and the hock.'],
      ['Hock', 'The large angled hind leg joint, like the human ankle.'],
      ['Cannon Bone', 'The lower leg bone between the knee or hock and the fetlock.'],
      ['Fetlock', 'The prominent joint between the cannon bone and the pastern.'],
      ['Pastern', 'The sloping section between the fetlock and the hoof.'],
      ['Coronet Band', 'The band at the top of the hoof where the hoof wall grows from.'],
      ['Chestnut', 'A small horn-like growth on the inside of each leg.'],
      ['Knee', 'The front leg joint between the forearm and the cannon bone.'],
      ['Hoof', 'The hard outer covering that protects the foot.']
    ]
  }
});
</script>
