<style>.game-wrap{max-width:980px;margin:0 auto;padding:2rem var(--page-pad) 4rem}.board{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 10px 28px rgba(13,27,62,.12);padding:1.5rem}.row{display:grid;grid-template-columns:1fr 240px;gap:1rem;align-items:center;border-bottom:1px solid var(--border);padding:1rem 0}.row:last-child{border-bottom:0}.def{color:var(--text-mid);line-height:1.55}.select{padding:.75rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit;color:var(--navy);background:var(--white)}.actions{margin-top:1rem;display:flex;gap:.75rem}.actions button{border:0;border-radius:var(--radius);padding:.75rem 1rem;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:var(--gold)}.result{font-weight:900;color:var(--navy);margin-top:1rem}@media(max-width:700px){.row{grid-template-columns:1fr}}</style>
</head>
<body><div id="site-nav"></div><div id="course-breadcrumb"></div><section class="lesson-hero hero-centered hero-bg hero-bg-training-barn"><div class="lesson-hero-inner hero-centered"><div class="lesson-hero-text"><div class="lesson-module-tag">Common Riding Styles</div><h1 class="lesson-hero-title">Definition <span>Match</span></h1><p class="lesson-hero-desc">Match each discipline description to the correct name.</p></div></div></section><main class="game-wrap"><div class="board"><div id="rows"></div><div class="actions"><button class="primary" id="check">Check Answers</button><button id="reset">New Set</button></div><div class="result" id="result"></div></div></main><div id="site-footer"></div>
<script>
const bank=[['Dressage','Precise arena work that shows balance, rhythm, and communication.'],['Reining','Western pattern work with spins, circles, rollbacks, and sliding stops.'],['Barrel Racing','A timed cloverleaf pattern around three barrels.'],['Hunters','A judged jumping round emphasizing smoothness, rhythm, and form.'],['Jumpers','A jumping class scored by faults and time.'],['Ranch Riding','Western work that should look practical, forward, and useful.'],['Western Pleasure','A quiet rail class focused on a relaxed, consistent way of going.'],['Eventing','A three-phase English sport with dressage, cross-country, and stadium jumping.'],['Equitation','A class focused on rider position and effectiveness.'],['Saddle Seat','A show style often emphasizing animation and presence.']];let active=[];const rows=document.getElementById('rows'),result=document.getElementById('result');function shuffle(a){return a.map(v=>({v,s:Math.random()})).sort((x,y)=>x.s-y.s).map(i=>i.v)}function start(){active=shuffle(bank).slice(0,6);const names=shuffle(active.map(x=>x[0]));rows.innerHTML=active.map((item,i)=>`<div class="row"><div class="def">${item[1]}</div><select class="select" data-answer="${item[0]}"><option value="">Choose a discipline</option>${names.map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>`).join('');result.textContent=''}document.getElementById('check').addEventListener('click',()=>{let score=0;rows.querySelectorAll('select').forEach(s=>{if(s.value===s.dataset.answer){score++;s.style.borderColor='#2d7a4f'}else{s.style.borderColor='#c0392b'}});result.textContent='Score: '+score+' out of '+active.length+'. Choose New Set to practice another group.'});document.getElementById('reset').addEventListener('click',start);start();
</script><script src="../course-config.js"></script><script>window.CURRENT_MODULE=4;window.LAYOUT={homeUrl:'../../../../../index.html',coursesUrl:'../../../../index.html',navCta:{label:'Back to Training Barn',url:'../5-training-barn.html'}};</script><script src="../../../../../assets/js/layout.js"></script><script src="../../../../../assets/js/course-nav.js"></script></body></html>
