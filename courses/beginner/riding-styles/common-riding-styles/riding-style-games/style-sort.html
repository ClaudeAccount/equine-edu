<style>.game-wrap{max-width:980px;margin:0 auto;padding:2rem var(--page-pad) 4rem}.game-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 10px 28px rgba(13,27,62,.12);overflow:hidden}.game-top{background:var(--navy);color:var(--white);padding:1rem 1.25rem;display:flex;justify-content:space-between;gap:1rem;align-items:center}.game-body{padding:1.5rem}.prompt{font-family:var(--font-display);font-size:clamp(2rem,5vw,3rem);color:var(--navy);text-align:center;margin:1rem 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.choice{border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--off-white);padding:1.2rem;font-weight:900;color:var(--navy);cursor:pointer}.choice:hover{border-color:var(--gold)}.feedback{min-height:2rem;text-align:center;font-weight:800;margin-top:1rem}.actions{display:flex;gap:.75rem;justify-content:center;margin-top:1rem}.actions button{border:0;border-radius:var(--radius);padding:.75rem 1rem;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:var(--gold)}@media(max-width:640px){.choices{grid-template-columns:1fr}}</style>
</head>
<body><div id="site-nav"></div><div id="course-breadcrumb"></div><section class="lesson-hero hero-centered hero-bg hero-bg-training-barn"><div class="lesson-hero-inner hero-centered"><div class="lesson-hero-text"><div class="lesson-module-tag">Common Riding Styles</div><h1 class="lesson-hero-title">Western or <span>English</span></h1><p class="lesson-hero-desc">Sort each riding discipline into the correct style family.</p></div></div></section><main class="game-wrap"><div class="game-card"><div class="game-top"><strong id="round">Round 1 of 10</strong><strong id="score">0 / 0</strong></div><div class="game-body"><div class="prompt" id="prompt"></div><div class="choices"><button class="choice" data-answer="Western">Western</button><button class="choice" data-answer="English">English</button></div><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="next">Next</button><button id="reset">Play Again</button></div></div></div></main><div id="site-footer"></div>
<script>
const bank=[['Reining','Western'],['Barrel Racing','Western'],['Ranch Riding','Western'],['Western Pleasure','Western'],['Cutting','Western'],['Roping','Western'],['Trail Riding','Western'],['Western Horsemanship','Western'],['Dressage','English'],['Hunters','English'],['Jumpers','English'],['Eventing','English'],['Equitation','English'],['Saddle Seat','English'],['English Pleasure','English'],['Cross-Country','English']];let round=0,score=0,active=[];const promptEl=document.getElementById('prompt'),roundEl=document.getElementById('round'),scoreEl=document.getElementById('score'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function shuffle(a){return a.map(v=>({v,s:Math.random()})).sort((x,y)=>x.s-y.s).map(i=>i.v)}function start(){active=shuffle(bank).slice(0,10);round=0;score=0;show()}function show(){feedback.textContent='';document.querySelectorAll('.choice').forEach(b=>b.disabled=false);promptEl.textContent=active[round][0];roundEl.textContent='Round '+(round+1)+' of '+active.length;scoreEl.textContent=score+' / '+round;next.style.display='none'}document.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const ok=btn.dataset.answer===active[round][1];if(ok)score++;feedback.textContent=ok?'Correct.':'Not quite. '+active[round][0]+' belongs with '+active[round][1]+'.';scoreEl.textContent=score+' / '+(round+1);next.style.display='inline-block'}));next.addEventListener('click',()=>{round++;if(round>=active.length){promptEl.textContent='Finished';feedback.textContent='Score: '+score+' out of '+active.length+'. Play again for a new set.';roundEl.textContent='Complete';document.querySelectorAll('.choice').forEach(b=>b.disabled=true);next.style.display='none';return}show()});document.getElementById('reset').addEventListener('click',start);start();
</script><script src="../course-config.js"></script><script>window.CURRENT_MODULE=4;window.LAYOUT={homeUrl:'../../../../../index.html',coursesUrl:'../../../../index.html',navCta:{label:'Back to Training Barn',url:'../5-training-barn.html'}};</script><script src="../../../../../assets/js/layout.js"></script><script src="../../../../../assets/js/course-nav.js"></script></body></html>
