<body><div id="site-nav"></div><div id="course-breadcrumb"></div><section class="lesson-hero hero-centered hero-bg hero-bg-training-barn"><div class="lesson-hero-inner hero-centered"><div class="lesson-hero-text"><div class="lesson-module-tag">Common Riding Styles</div><h1 class="lesson-hero-title">Match the <span>Job</span></h1><p class="lesson-hero-desc">Choose the discipline that best matches the goal.</p></div></div></section><main class="game-wrap"><div class="game-card"><div class="top"><span id="round"></span><span id="score"></span></div><div class="prompt" id="prompt"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="primary" id="next">Next</button> <button id="reset">Play Again</button></div></div></main><div id="site-footer"></div>
<script>
const bank=[{p:'A horse and rider complete a cloverleaf pattern as quickly as possible.',a:'Barrel Racing',o:['Barrel Racing','Dressage','Hunters','Saddle Seat']},{p:'A horse performs circles, spins, rollbacks, and sliding stops in a pattern.',a:'Reining',o:['Reining','Eventing','Equitation','Western Pleasure']},{p:'A horse should look useful, forward, and comfortable for ranch-type work.',a:'Ranch Riding',o:['Ranch Riding','Jumpers','Dressage','Saddle Seat']},{p:'A horse and rider clear a jumping course where faults and time matter.',a:'Jumpers',o:['Jumpers','Western Pleasure','Roping','Trail Riding']},{p:'A horse performs a precise arena test of balanced figures and transitions.',a:'Dressage',o:['Dressage','Cutting','Barrel Racing','Hunters']},{p:'A horse is judged on smooth rhythm, manners, and attractive jumping form.',a:'Hunters',o:['Hunters','Jumpers','Reining','Roping']},{p:'A sport includes dressage, cross-country, and stadium jumping.',a:'Eventing',o:['Eventing','Ranch Riding','Western Pleasure','Cutting']},{p:'The class focuses on the rider position and effectiveness.',a:'Equitation',o:['Equitation','Barrel Racing','Roping','Western Pleasure']},{p:'The horse works with cattle and responds to stock movement.',a:'Cutting',o:['Cutting','Dressage','Hunters','Saddle Seat']},{p:'A quiet rail class rewards a relaxed walk, jog, and lope.',a:'Western Pleasure',o:['Western Pleasure','Eventing','Jumpers','Dressage']}];let active=[],round=0,score=0;const promptEl=document.getElementById('prompt'),options=document.getElementById('options'),feedback=document.getElementById('feedback'),next=document.getElementById('next');function shuffle(a){return a.map(v=>({v,s:Math.random()})).sort((x,y)=>x.s-y.s).map(i=>i.v)}function start(){active=shuffle(bank).slice(0,8);round=0;score=0;show()}function show(){const q=active[round];feedback.textContent='';promptEl.textContent=q.p;document.getElementById('round').textContent='Round '+(round+1)+' of '+active.length;document.getElementById('score').textContent=score+' / '+round;options.innerHTML=shuffle(q.o).map(o=>'<button class="option" data-val="'+o+'">'+o+'</button>').join('');next.style.display='none';options.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{options.querySelectorAll('button').forEach(x=>x.disabled=true);const ok=b.dataset.val===q.a;if(ok)score++;feedback.textContent=ok?'Correct.':'Not quite. The best match is '+q.a+'.';document.getElementById('score').textContent=score+' / '+(round+1);next.style.display='inline-block'}))}next.addEventListener('click',()=>{round++;if(round>=active.length){promptEl.textContent='Finished';options.innerHTML='';feedback.textContent='Score: '+score+' out of '+active.length+'. Play again for a new set.';document.getElementById('round').textContent='Complete';next.style.display='none';return}show()});document.getElementById('reset').addEventListener('click',start);start();
</script><script src="../course-config.js"></script><script>window.CURRENT_MODULE=4;window.LAYOUT={homeUrl:'../../../../../index.html',coursesUrl:'../../../../index.html',navCta:{label:'Back to Training Barn',url:'../5-training-barn.html'}};</script><script src="../../../../../assets/js/layout.js"></script><script src="../../../../../assets/js/course-nav.js"></script></body></html>
