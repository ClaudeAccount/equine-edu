<style>
/* ── Game shell ── */
.game-wrap {
  max-width: 680px;
  margin: 0 auto;
}

/* ── Progress bar ── */
.challenge-progress {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.challenge-progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}
.challenge-progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 999px;
  transition: width 0.4s ease;
}
.challenge-progress-label {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--text-mid);
  white-space: nowrap;
}

/* ── Score badge ── */
.challenge-score-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 0.3rem 0.9rem;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--navy);
}

/* ── Horse photo ── */
.challenge-photo-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--off-white);
  border: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.challenge-photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
.challenge-photo-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: var(--radius-lg);
  transition: background 0.25s;
}
.challenge-photo-overlay.correct { background: rgba(40,180,99,0.18); }
.challenge-photo-overlay.wrong   { background: rgba(220,53,69,0.18); }

/* ── Answer grid ── */
.answer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin-bottom: 1.25rem;
}
.answer-btn {
  width: 100%;
  padding: 0.85rem 1rem;
  background: var(--white);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--navy);
  cursor: pointer;
  text-align: center;
  transition: border-color 0.18s, background 0.18s, color 0.18s, transform 0.1s;
  line-height: 1.3;
}
.answer-btn:hover:not(:disabled) {
  border-color: var(--navy);
  background: var(--off-white);
  transform: translateY(-1px);
}
.answer-btn:disabled { cursor: default; }
.answer-btn.correct {
  background: rgba(40,180,99,0.12);
  border-color: #28b463;
  color: #1a7a42;
}
.answer-btn.wrong {
  background: rgba(220,53,69,0.10);
  border-color: #dc3545;
  color: #a71d2a;
}
.answer-btn.reveal {
  background: rgba(40,180,99,0.08);
  border-color: #28b463;
  color: #1a7a42;
  opacity: 0.7;
}

/* ── Feedback bar ── */
.challenge-feedback {
  min-height: 2.8rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 1rem;
  border-radius: var(--radius);
  font-size: 0.88rem;
  font-weight: 600;
  margin-bottom: 1rem;
  transition: background 0.2s;
}
.challenge-feedback.correct {
  background: rgba(40,180,99,0.12);
  color: #1a7a42;
  border: 1px solid rgba(40,180,99,0.3);
}
.challenge-feedback.wrong {
  background: rgba(220,53,69,0.08);
  color: #a71d2a;
  border: 1px solid rgba(220,53,69,0.25);
}
.challenge-feedback.hidden { visibility: hidden; }
.next-btn {
  flex-shrink: 0;
  padding: 0.4rem 1rem;
  background: var(--navy);
  color: var(--gold);
  border: none;
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: opacity 0.15s;
}
.next-btn:hover { opacity: 0.85; }

/* ── Results screen ── */
.results-screen {
  display: none;
  text-align: center;
  padding: 2.5rem 2rem 2rem;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
.results-screen.visible { display: flex; }
.results-trophy {
  font-size: 3rem;
  line-height: 1;
}
.results-score-big {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 1.7rem;
  color: var(--gold);
  line-height: 1;
}
.results-score-label {
  font-family: var(--font-display);
  font-size: 1.4rem;
  color: var(--navy);
  margin-bottom: 0;
}
.results-message {
  font-size: 0.9rem;
  color: var(--text-mid);
  line-height: 1.65;
  max-width: 420px;
  margin: 0 auto;
}
.results-actions {
  display: flex;
  gap: 0.75rem;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-primary {
  padding: 0.7rem 1.5rem;
  background: var(--navy);
  color: var(--gold);
  border: none;
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: opacity 0.15s;
  text-decoration: none;
  display: inline-block;
}
.btn-primary:hover { opacity: 0.85; }
.btn-secondary {
  padding: 0.7rem 1.5rem;
  background: var(--white);
  color: var(--navy);
  border: 2px solid var(--border);
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  transition: border-color 0.15s;
  text-decoration: none;
  display: inline-block;
}
.btn-secondary:hover { border-color: var(--navy); }

/* ── Review list ── */
.review-list {
  margin-top: 2rem;
  text-align: left;
}
.review-list h3 {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--navy);
  margin-bottom: 0.75rem;
}
.review-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.review-item:last-child { border-bottom: none; }
.review-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.review-dot.correct { background: #28b463; }
.review-dot.wrong   { background: #dc3545; }
.review-color-name { font-weight: 700; color: var(--navy); flex: 1; }
.review-answer     { color: var(--text-mid); }

/* ── Loading state ── */
.photo-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--off-white);
  color: var(--text-mid);
  font-size: 0.85rem;
}
.lesson-wrap { grid-template-columns: minmax(0, 1040px); justify-content: center; }
.lesson-left { max-width: none; }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   COLOR IDENTIFICATION CHALLENGE — Game Logic
   ═══════════════════════════════════════════════════════════════ */

var COLORS = [
  { name: 'Chestnut',        img: 'colors/chestnut.png',         group: 'Base Coat Colors' },
  { name: 'Sorrel',          img: 'colors/sorrel.png',           group: 'Base Coat Colors' },
  { name: 'Liver Chestnut',  img: 'colors/liver-chestnut.png',   group: 'Base Coat Colors' },
  { name: 'Flaxen Chestnut', img: 'colors/flaxen-chestnut.png',  group: 'Base Coat Colors' },
  { name: 'Black',           img: 'colors/black.png',            group: 'Base Coat Colors' },
  { name: 'Bay',             img: 'colors/bay.png',              group: 'Base Coat Colors' },
  { name: 'Palomino',        img: 'colors/palomino.png',         group: 'Golden & Lightened' },
  { name: 'Buckskin',        img: 'colors/buckskin.png',         group: 'Golden & Lightened' },
  { name: 'Gray',            img: 'colors/gray.png',             group: 'Gray' },
  { name: 'Dapple Gray',     img: 'colors/dapple-gray.png',      group: 'Gray' },
  { name: 'Flea-Bitten Gray',img: 'colors/flea-bitten-gray.png', group: 'Gray' },
  { name: 'Rose Gray',       img: 'colors/rose-gray.png',        group: 'Gray' },
  { name: 'Strawberry Roan', img: 'colors/strawberry-roan.png',  group: 'Roan' },
  { name: 'Blue Roan',       img: 'colors/blue-roan.png',        group: 'Roan' },
  { name: 'Bay Roan',        img: 'colors/bay-roan.png',         group: 'Roan' },
  { name: 'Tobiano',         img: 'colors/tobiano.png',          group: 'Patterned' },
  { name: 'Overo',           img: 'colors/overo.png',            group: 'Patterned' },
  { name: 'Leopard Appaloosa',         img: 'colors/leopard-appaloosa.png',group: 'Patterned' },
  { name: 'Blanket Appaloosa',         img: 'colors/blanket-appaloosa.png',group: 'Patterned' }
];

var ROUNDS       = 10;
var state        = {};

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function buildRounds() {
  var pool = shuffle(COLORS).slice(0, ROUNDS);
  return pool.map(function(correct) {
    var wrong = shuffle(COLORS.filter(function(c){ return c.name !== correct.name; })).slice(0, 3);
    var choices = shuffle([correct].concat(wrong));
    return { correct: correct, choices: choices };
  });
}

function startGame() {
  state = {
    rounds:    buildRounds(),
    current:   0,
    score:     0,
    answered:  false,
    history:   []
  };
  document.getElementById('results-screen').classList.remove('visible');
  document.getElementById('progress-row').style.display = '';
  document.getElementById('photo-wrap').style.display   = '';
  document.getElementById('answer-grid').style.display  = '';
  renderRound();
}

function renderRound() {
  var round   = state.rounds[state.current];
  var roundNo = state.current + 1;
  state.answered = false;

  /* Progress */
  document.getElementById('progress-fill').style.width = ((state.current / ROUNDS) * 100) + '%';
  document.getElementById('round-label').textContent   = 'Round ' + roundNo + ' of ' + ROUNDS;
  document.getElementById('score-display').textContent = state.score;

  /* Photo */
  var img     = document.getElementById('horse-photo');
  var loading = document.getElementById('photo-loading');
  var overlay = document.getElementById('photo-overlay');
  overlay.className = 'challenge-photo-overlay';
  img.style.display = 'none';
  loading.style.display = 'flex';
  img.src = round.correct.img;

  /* Choices */
  var grid = document.getElementById('answer-grid');
  grid.innerHTML = '';
  round.choices.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className   = 'answer-btn';
    btn.textContent = c.name;
    btn.onclick     = function(){ handleAnswer(c.name, round.correct.name); };
    grid.appendChild(btn);
  });

  /* Feedback */
  hideFeedback();
}

function photoLoaded() {
  document.getElementById('photo-loading').style.display = 'none';
  document.getElementById('horse-photo').style.display   = 'block';
}
function photoError() {
  document.getElementById('photo-loading').textContent = 'Image not found';
}

function handleAnswer(chosen, correct) {
  if (state.answered) return;
  state.answered = true;

  var isCorrect = chosen === correct;
  if (isCorrect) state.score++;
  state.history.push({ correct: correct, chosen: chosen, isCorrect: isCorrect });

  /* Color all buttons */
  var btns = document.getElementById('answer-grid').querySelectorAll('.answer-btn');
  btns.forEach(function(btn) {
    btn.disabled = true;
    if (btn.textContent === correct) {
      btn.classList.add(isCorrect ? 'correct' : 'reveal');
    } else if (btn.textContent === chosen && !isCorrect) {
      btn.classList.add('wrong');
    }
  });

  /* Photo overlay */
  document.getElementById('photo-overlay').className = 'challenge-photo-overlay ' + (isCorrect ? 'correct' : 'wrong');

  /* Feedback bar */
  var fb   = document.getElementById('feedback-bar');
  var text = document.getElementById('feedback-text');
  fb.className = 'challenge-feedback ' + (isCorrect ? 'correct' : 'wrong');
  text.textContent = isCorrect
    ? '✓ Correct! That is a ' + correct + '.'
    : '✗ Not quite — this is a ' + correct + '.';

  /* Last round: change button label */
  if (state.current === ROUNDS - 1) {
    document.getElementById('next-btn').textContent = 'See Results →';
  }
}

function hideFeedback() {
  var fb = document.getElementById('feedback-bar');
  fb.className = 'challenge-feedback hidden';
}

function nextRound() {
  state.current++;
  if (state.current >= ROUNDS) {
    showResults();
  } else {
    renderRound();
  }
}

function showResults() {
  /* Hide game elements */
  document.getElementById('progress-row').style.display  = 'none';
  document.getElementById('photo-wrap').style.display    = 'none';
  document.getElementById('answer-grid').style.display   = 'none';
  hideFeedback();

  var s   = state.score;
  var pct = s / ROUNDS;
  var trophy, label, msg;

  if (pct === 1) {
    trophy = '🏆'; label = 'Perfect Score!';
    msg = 'A clean ten out of ten — you know your horse coat colors. Excellent work.';
  } else if (pct >= 0.8) {
    trophy = '🥇'; label = 'Great job!';
    msg = 'Strong result. A few colors tripped you up — review those and try again for a perfect score.';
  } else if (pct >= 0.6) {
    trophy = '🥈'; label = 'Good effort!';
    msg = 'Solid base coat color understanding. Keep practicing — the trickier colors will start to click with a bit more review.';
  } else {
    trophy = '📚'; label = 'Keep practicing!';
    msg = 'This is a good challenge. Go back to the lessons, then come back and try again — you will improve quickly.';
  }

  document.getElementById('results-trophy').textContent       = trophy;
  document.getElementById('results-score-big').textContent    = s + ' / ' + ROUNDS;
  document.getElementById('results-score-label').textContent  = label;
  document.getElementById('results-message').textContent      = msg;
  document.getElementById('score-display').textContent        = s;
  document.getElementById('progress-fill').style.width        = '100%';
  document.getElementById('round-label').textContent          = 'Complete!';

  /* Review list */
  var container = document.getElementById('review-items');
  container.innerHTML = '';
  state.history.forEach(function(h, i) {
    var div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML =
      '<div class="review-dot ' + (h.isCorrect ? 'correct' : 'wrong') + '"></div>' +
      '<span class="review-color-name">Round ' + (i+1) + ': ' + h.correct + '</span>' +
      '<span class="review-answer">' + (h.isCorrect ? '✓ Correct' : 'You said: ' + h.chosen) + '</span>';
    container.appendChild(div);
  });

  document.getElementById('results-screen').classList.add('visible');
}

function restartGame() {
  document.getElementById('progress-row').style.display = '';
  document.getElementById('photo-wrap').style.display   = '';
  document.getElementById('answer-grid').style.display  = '';
  startGame();
}

/* Expose for HTML onclick */
window.nextRound    = nextRound;
window.restartGame  = restartGame;
window.photoLoaded  = photoLoaded;
window.photoError   = photoError;

/* Boot */
startGame();
</script>
