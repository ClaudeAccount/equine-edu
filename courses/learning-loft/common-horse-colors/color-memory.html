<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Memory Game &mdash; Common Horse Colors &mdash; Equine Edu</title>
<meta name="description" content="Flip cards to match each horse photo to its color name — a concentration-style memory game.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../assets/css/core.css">

<style>
/* ── Stats bar ── */
.memory-stats {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.25rem;
  flex-wrap: wrap;
}
.memory-stat {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-mid);
}
.memory-stat strong { color: var(--navy); font-size: 1rem; }

/* ── Difficulty selector ── */
.difficulty-bar {
  display: flex;
  gap: 0.4rem;
  padding: 0.4rem;
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 1.25rem;
  width: fit-content;
}
.diff-btn {
  padding: 0.35rem 0.9rem;
  border: 2px solid transparent;
  border-radius: calc(var(--radius) - 2px);
  background: transparent;
  color: rgba(13,27,62,0.5);
  font-family: var(--font-body);
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.diff-btn.active {
  background: var(--navy);
  color: var(--gold);
  border-color: var(--navy);
}
.diff-btn:not(.active):hover { color: var(--navy); }

/* ── Memory grid ── */
.memory-grid {
  display: grid;
  gap: 0.6rem;
  margin-bottom: 1.25rem;
}
.memory-grid.size-6  { grid-template-columns: repeat(4, 1fr); }
.memory-grid.size-10 { grid-template-columns: repeat(5, 1fr); }
.memory-grid.size-19 { grid-template-columns: repeat(6, 1fr); }

@media(max-width:600px) {
  .memory-grid.size-6  { grid-template-columns: repeat(3, 1fr); }
  .memory-grid.size-10 { grid-template-columns: repeat(4, 1fr); }
  .memory-grid.size-19 { grid-template-columns: repeat(4, 1fr); }
}

/* ── Individual card ── */
.mem-card {
  aspect-ratio: 3 / 4;
  perspective: 800px;
  cursor: pointer;
}
.mem-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.4,0.2,0.2,1);
  border-radius: var(--radius);
}
.mem-card.flipped .mem-inner,
.mem-card.matched .mem-inner { transform: rotateY(180deg); }

.mem-front, .mem-back {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  overflow: hidden;
}

/* Card back (face-down) */
.mem-front {
  background: var(--navy);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(201,168,76,0.3);
}
.mem-front-logo {
  font-size: 1.4rem;
  opacity: 0.55;
}

/* Card face (face-up) */
.mem-back {
  transform: rotateY(180deg);
  background: var(--white);
  border: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Photo card */
.mem-back.photo-card img {
  width: 100%;
  height: 75%;
  object-fit: cover;
  object-position: center top;
  display: block;
}
.mem-back.photo-card .mem-card-label {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--text-mid);
  text-align: center;
  padding: 0 0.3rem;
  line-height: 1.3;
}

/* Name card */
.mem-back.name-card {
  background: var(--navy);
  border-color: var(--navy);
  padding: 0.5rem;
}
.mem-back.name-card .name-card-text {
  font-family: var(--font-display);
  font-size: 0.78rem;
  color: var(--gold);
  text-align: center;
  line-height: 1.3;
}

/* Matched state */
.mem-card.matched .mem-back {
  border-color: #28b463;
  background: rgba(40,180,99,0.08);
}
.mem-card.matched .mem-back.name-card {
  background: #28b463;
  border-color: #28b463;
}
.mem-card.matched .mem-back.name-card .name-card-text { color: #fff; }

/* Wrong-pair flash */
.mem-card.wrong-flash .mem-inner { animation: wrongFlash 0.5s ease; }
@keyframes wrongFlash {
  0%,100%{ box-shadow: none; }
  40%    { box-shadow: 0 0 0 3px #dc3545; }
}

/* ── Actions ── */
.memory-actions {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.btn-primary {
  padding: 0.65rem 1.4rem;
  background: var(--navy);
  color: var(--gold);
  border: none;
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.87rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: opacity 0.15s;
  text-decoration: none;
  display: inline-block;
}
.btn-primary:hover { opacity: 0.85; }
.btn-secondary {
  padding: 0.65rem 1.4rem;
  background: var(--white);
  color: var(--navy);
  border: 2px solid var(--border);
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.87rem;
  font-weight: 700;
  cursor: pointer;
  transition: border-color 0.15s;
  text-decoration: none;
  display: inline-block;
}
.btn-secondary:hover { border-color: var(--navy); }

/* ── Completion banner ── */
.completion-banner {
  display: none;
  text-align: center;
  padding: 2.5rem 2rem 2rem;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
.completion-banner.visible { display: flex; }
.completion-emoji { font-size: 3rem; line-height: 1; }
.completion-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--navy);
}
.completion-sub {
  font-size: 0.9rem;
  color: var(--text-mid);
  line-height: 1.7;
  max-width: 400px;
  margin: 0 auto;
}
.score-pill {
  display: inline-block;
  background: var(--navy);
  color: var(--gold);
  border-radius: 999px;
  padding: 0.4rem 1.1rem;
  font-size: 0.85rem;
  font-weight: 800;
}
.lesson-wrap { grid-template-columns: minmax(0, 1040px); justify-content: center; }
.lesson-left { max-width: none; }
</style>
</head>

        <div class="difficulty-bar" id="diff-bar">

          <button class="diff-btn"        onclick="setDifficulty(10)" id="diff-10">Standard (10 pairs)</button>

        <div class="memory-stats">

        <div class="memory-actions">

        </div>
      </div>

    </div>
  </main>
</div>

<script src="../../../assets/js/layout.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   COLOR MEMORY GAME — Logic
   Each pair = one photo card + one name card
   ═══════════════════════════════════════════════════════════════ */

var ALL_COLORS = [
  { name: 'Chestnut',         img: 'colors/chestnut.png' },
  { name: 'Sorrel',           img: 'colors/sorrel.png' },
  { name: 'Liver Chestnut',   img: 'colors/liver-chestnut.png' },
  { name: 'Flaxen Chestnut',  img: 'colors/flaxen-chestnut.png' },
  { name: 'Black',            img: 'colors/black.png' },
  { name: 'Bay',              img: 'colors/bay.png' },
  { name: 'Palomino',         img: 'colors/palomino.png' },
  { name: 'Buckskin',         img: 'colors/buckskin.png' },
  { name: 'Gray',             img: 'colors/gray.png' },
  { name: 'Dapple Gray',      img: 'colors/dapple-gray.png' },
  { name: 'Flea-Bitten Gray', img: 'colors/flea-bitten-gray.png' },
  { name: 'Rose Gray',        img: 'colors/rose-gray.png' },
  { name: 'Strawberry Roan',  img: 'colors/strawberry-roan.png' },
  { name: 'Blue Roan',        img: 'colors/blue-roan.png' },
  { name: 'Bay Roan',         img: 'colors/bay-roan.png' },
  { name: 'Tobiano',          img: 'colors/tobiano.png' },
  { name: 'Overo',            img: 'colors/overo.png' },
  { name: 'Leopard Appaloosa',          img: 'colors/leopard-appaloosa.png' },
  { name: 'Blanket Appaloosa',          img: 'colors/blanket-appaloosa.png' }
];

var state = {
  pairs:        6,
  flips:        0,
  matches:      0,
  misses:       0,
  flipped:      [],   /* up to 2 face-up, unmatched cards */
  locked:       false
};

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function setDifficulty(n) {
  state.pairs = n;
  ['6','10','19'].forEach(function(d){
    document.getElementById('diff-' + d).classList.toggle('active', +d === n);
  });
  buildGame();
}

function buildGame() {
  state.flips   = 0;
  state.matches = 0;
  state.misses  = 0;
  state.flipped = [];
  state.locked  = false;

  document.getElementById('completion-banner').classList.remove('visible');
  document.getElementById('game-main').style.display = '';

  updateStats();
  document.getElementById('pair-count').textContent = state.pairs;

  /* Pick colors for this round */
  var pool = shuffle(ALL_COLORS).slice(0, state.pairs);

  /* Build card data: one photo + one name per pair */
  var cards = [];
  pool.forEach(function(c, i) {
    cards.push({ id: i, type: 'photo', color: c });
    cards.push({ id: i, type: 'name',  color: c });
  });
  cards = shuffle(cards);

  /* Grid sizing class */
  var grid = document.getElementById('memory-grid');
  grid.className = 'memory-grid size-' + state.pairs;
  grid.innerHTML = '';

  cards.forEach(function(card, idx) {
    var el = buildCardEl(card, idx);
    grid.appendChild(el);
  });
}

function buildCardEl(card, idx) {
  var el = document.createElement('div');
  el.className = 'mem-card';
  el.dataset.pairId = card.id;
  el.dataset.type   = card.type;

  var inner = document.createElement('div');
  inner.className = 'mem-inner';

  /* Face-down side */
  var front = document.createElement('div');
  front.className = 'mem-front';
  var logo = document.createElement('span');
  logo.className   = 'mem-front-logo';
  logo.textContent = '🐴';
  front.appendChild(logo);

  /* Face-up side */
  var back = document.createElement('div');

  if (card.type === 'photo') {
    back.className = 'mem-back photo-card';
    var img = document.createElement('img');
    img.src = card.color.img;
    img.alt = card.color.name;
    img.onerror = function(){ this.style.display='none'; };
    var lbl = document.createElement('div');
    lbl.className   = 'mem-card-label';
    lbl.textContent = 'Photo';
    back.appendChild(img);
    back.appendChild(lbl);
  } else {
    back.className = 'mem-back name-card';
    var txt = document.createElement('div');
    txt.className   = 'name-card-text';
    txt.textContent = card.color.name;
    back.appendChild(txt);
  }

  inner.appendChild(front);
  inner.appendChild(back);
  el.appendChild(inner);

  el.addEventListener('click', function() { handleFlip(el); });
  return el;
}

function handleFlip(el) {
  if (state.locked) return;
  if (el.classList.contains('flipped')) return;
  if (el.classList.contains('matched')) return;
  if (state.flipped.length >= 2) return;

  el.classList.add('flipped');
  state.flips++;
  state.flipped.push(el);
  updateStats();

  if (state.flipped.length === 2) {
    state.locked = true;
    checkMatch();
  }
}

function checkMatch() {
  var a = state.flipped[0];
  var b = state.flipped[1];

  var sameId   = a.dataset.pairId === b.dataset.pairId;
  var diffType = a.dataset.type   !== b.dataset.type;

  if (sameId && diffType) {
    /* Match! */
    setTimeout(function() {
      a.classList.add('matched');
      b.classList.add('matched');
      a.classList.remove('flipped');
      b.classList.remove('flipped');
      state.matches++;
      state.flipped = [];
      state.locked  = false;
      updateStats();
      if (state.matches === state.pairs) showCompletion();
    }, 500);
  } else {
    /* No match */
    state.misses++;
    a.classList.add('wrong-flash');
    b.classList.add('wrong-flash');
    setTimeout(function() {
      a.classList.remove('flipped','wrong-flash');
      b.classList.remove('flipped','wrong-flash');
      state.flipped = [];
      state.locked  = false;
      updateStats();
    }, 900);
  }
}

function updateStats() {
  document.getElementById('flip-count').textContent  = state.flips;
  document.getElementById('match-count').textContent = state.matches;
  document.getElementById('miss-count').textContent  = state.misses;
}

function showCompletion() {
  document.getElementById('game-main').style.display = 'none';
  document.getElementById('completion-banner').classList.add('visible');

  var total = state.flips;
  var emoji, sub;
  if (state.misses === 0) {
    emoji = '🏆'; sub = 'Perfect memory — not a single mismatch! You clearly know your horse colors inside and out.';
  } else if (state.misses <= 3) {
    emoji = '🥇'; sub = 'Excellent! Just a few misses — your memory for these color names is very strong.';
  } else if (state.misses <= 8) {
    emoji = '🥈'; sub = 'Good work! A few pairs were tricky. Play again and see if you can cut down those misses.';
  } else {
    emoji = '📚'; sub = 'Nice effort! The more you play, the easier these pairs will come. Try again — you will improve quickly.';
  }

  document.getElementById('comp-emoji').textContent = emoji;
  document.getElementById('comp-sub').textContent   = sub;
  document.getElementById('comp-score').textContent =
    state.pairs + ' pairs matched · ' + state.flips + ' flips · ' + state.misses + ' mismatches';
}

function restartGame() {
  buildGame();
}

window.setDifficulty = setDifficulty;
window.restartGame   = restartGame;

/* Boot */
buildGame();
</script>
