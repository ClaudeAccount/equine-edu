<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Region Sort &mdash; External Equine Anatomy &mdash; Equine Edu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../assets/css/core.css">
<link rel="stylesheet" href="../../../../assets/css/components.css">
<link rel="stylesheet" href="../../../../assets/css/course.css">
<style>
.lesson-wrap{grid-template-columns:minmax(0,1040px);justify-content:center;}
.lesson-left{max-width:none;}

.game-wrap { max-width: 700px; margin: 0 auto; }
.score-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; font-size: 0.82rem; font-weight: 700; color: var(--text-mid); }
.score-bar span { color: var(--navy); }

/* Term to sort */
.term-display { background: var(--navy); color: var(--white); border-radius: var(--radius-lg); padding: 1.5rem; text-align: center; margin-bottom: 1.25rem; }
.term-prompt { font-size: 0.68rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.55); margin-bottom: 0.5rem; }
.term-name { font-family: var(--font-display); font-size: 2rem; color: var(--gold); line-height: 1.2; }
.terms-remaining { font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-top: 0.4rem; }

/* Region buckets */
.buckets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
.bucket-btn { padding: 1rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--white); color: var(--navy); font-family: var(--font-body); font-weight: 800; font-size: 0.88rem; cursor: pointer; transition: all 0.15s; text-align: center; }
.bucket-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(201,168,76,0.08); }
.bucket-btn.correct-flash { border-color: #2d7a4f; background: #e8f7ef; color: #1a5c38; }
.bucket-btn.wrong-flash   { border-color: #c0392b; background: #fdf2f2; color: #8b1a1a; }

/* Feedback */
.sort-feedback { font-size: 0.84rem; padding: 0.65rem 0.9rem; border-radius: var(--radius); text-align: center; min-height: 40px; margin-bottom: 0.5rem; display: none; }
.sort-feedback.show { display: block; }
.sort-feedback.correct { background: #e8f7ef; color: #1a5c38; border-left: 3px solid #2d7a4f; }
.sort-feedback.wrong   { background: #fdf2f2; color: #8b1a1a; border-left: 3px solid #c0392b; }

/* Results */
.result-card { background: var(--navy); color: var(--white); border-radius: var(--radius-lg); padding: 2rem; text-align: center; display: none; }
.result-card.show { display: block; }
.result-big { font-family: var(--font-display); font-size: 3rem; color: var(--gold); }
.result-msg { font-size: 0.95rem; color: rgba(255,255,255,0.8); margin: 1rem 0 1.5rem; line-height: 1.6; }
.restart-btn { background: var(--gold); color: var(--navy); border: none; padding: 0.75rem 1.75rem; border-radius: var(--radius); font-weight: 800; font-size: 0.88rem; cursor: pointer; }

@media (max-width: 560px) {
  .buckets { grid-template-columns: 1fr; }
  .term-name { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div id="site-nav"></div>
<div id="course-breadcrumb"></div>

<section class="lesson-hero" id="top">
  <div class="lesson-hero-inner">
    <div class="lesson-hero-text">
      <div class="lesson-module-tag">Learning Loft</div>
      <h1 class="lesson-hero-title">Region <span>Sort</span></h1>
      <p class="lesson-hero-desc">A structure is shown &mdash; tap the region it belongs to. Ten questions per round, drawn from the full course term bank.</p>
    </div>
  </div>
</section>

<div class="lesson-wrap">
  <main class="lesson-left">
    <div class="game-wrap">
      <div id="game-area">
        <div class="score-bar">
          <div>Correct: <span id="correct-count">0</span></div>
          <div>Remaining: <span id="remaining-count">0</span></div>
        </div>

        <div class="term-display">
          <div class="term-prompt">Which region does this belong to?</div>
          <div class="term-name" id="current-term"></div>
          <div class="terms-remaining" id="terms-remaining-text"></div>
        </div>

        <div class="sort-feedback" id="sort-feedback"></div>

        <div class="buckets">
          <button class="bucket-btn" id="btn-head"   onclick="guess('Head')">Head</button>
          <button class="bucket-btn" id="btn-neck"   onclick="guess('Neck &amp; Shoulder')">Neck &amp; Shoulder</button>
          <button class="bucket-btn" id="btn-body"   onclick="guess('Body')">Body</button>
          <button class="bucket-btn" id="btn-legs"   onclick="guess('Legs')">Legs</button>
        </div>
      </div>

      <div class="result-card" id="result-card">
        <div class="score-label" style="font-size:.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55);">Final Score</div>
        <div class="result-big" id="result-big"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="restart-btn" onclick="startGame()">Play Again</button>
      </div>
    </div>
  </main>
</div>

<div id="site-footer"></div>

<script>
const TERMS = [
  // Head
  { term:"Ear",           region:"Head" },
  { term:"Poll",          region:"Head" },
  { term:"Foretop",       region:"Head" },
  { term:"Forehead",      region:"Head" },
  { term:"Eye",           region:"Head" },
  { term:"Cheek",         region:"Head" },
  { term:"Nostril",       region:"Head" },
  { term:"Muzzle",        region:"Head" },
  { term:"Upper Lip",     region:"Head" },
  { term:"Lower Lip",     region:"Head" },
  { term:"Chin Groove",   region:"Head" },
  { term:"Jaw",           region:"Head" },
  // Neck & Shoulder
  { term:"Throatlatch",   region:"Neck & Shoulder" },
  { term:"Crest",         region:"Neck & Shoulder" },
  { term:"Mane",          region:"Neck & Shoulder" },
  { term:"Neck",          region:"Neck & Shoulder" },
  { term:"Jugular Groove",region:"Neck & Shoulder" },
  { term:"Shoulder",      region:"Neck & Shoulder" },
  { term:"Point of Shoulder", region:"Neck & Shoulder" },
  { term:"Chest",         region:"Neck & Shoulder" },
  { term:"Upper Arm",     region:"Neck & Shoulder" },
  // Body
  { term:"Withers",       region:"Body" },
  { term:"Back",          region:"Body" },
  { term:"Loin",          region:"Body" },
  { term:"Croup",         region:"Body" },
  { term:"Point of Hip",  region:"Body" },
  { term:"Dock",          region:"Body" },
  { term:"Thigh",         region:"Body" },
  { term:"Buttock",       region:"Body" },
  { term:"Tail",          region:"Body" },
  { term:"Flank",         region:"Body" },
  { term:"Barrel",        region:"Body" },
  { term:"Heart Girth",   region:"Body" },
  // Legs
  { term:"Elbow",         region:"Legs" },
  { term:"Forearm",       region:"Legs" },
  { term:"Chestnut",      region:"Legs" },
  { term:"Knee",          region:"Legs" },
  { term:"Stifle",        region:"Legs" },
  { term:"Gaskin",        region:"Legs" },
  { term:"Hock",          region:"Legs" },
  { term:"Cannon Bone",   region:"Legs" },
  { term:"Fetlock",       region:"Legs" },
  { term:"Pastern",       region:"Legs" },
  { term:"Coronet Band",  region:"Legs" },
  { term:"Hoof",          region:"Legs" },
  { term:"Ergot",         region:"Legs" }
];

let queue = [], idx = 0, correct = 0, locked = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const ROUND_SIZE = 10;

function startGame() {
  queue = shuffle([...TERMS]).slice(0, ROUND_SIZE);
  idx = 0; correct = 0; locked = false;
  document.getElementById('result-card').classList.remove('show');
  document.getElementById('game-area').style.display = '';
  updateDisplay();
}

function updateDisplay() {
  if (idx >= queue.length) { endGame(); return; }
  const t = queue[idx];
  document.getElementById('current-term').textContent = t.term;
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('remaining-count').textContent = queue.length - idx;
  document.getElementById('terms-remaining-text').textContent = (queue.length - idx) + ' terms remaining';
  const fb = document.getElementById('sort-feedback');
  fb.className = 'sort-feedback';
  fb.textContent = '';
  locked = false;
}

function guess(region) {
  if (locked) return;
  locked = true;
  const t = queue[idx];
  const isCorrect = region === t.region;
  if (isCorrect) correct++;

  const fb = document.getElementById('sort-feedback');
  if (isCorrect) {
    fb.className = 'sort-feedback correct show';
    fb.textContent = '✓ Correct — ' + t.term + ' is in the ' + t.region + ' region.';
  } else {
    fb.className = 'sort-feedback wrong show';
    fb.textContent = '✗ Not quite — ' + t.term + ' belongs to ' + t.region + '.';
  }

  // Flash the button
  const btnMap = { 'Head':'btn-head', 'Neck & Shoulder':'btn-neck', 'Body':'btn-body', 'Legs':'btn-legs' };
  const clickedId = { 'Head':'btn-head', 'Neck & Shoulder':'btn-neck', 'Body':'btn-body', 'Legs':'btn-legs' }[region];
  const clickedBtn = document.getElementById(clickedId);
  clickedBtn.classList.add(isCorrect ? 'correct-flash' : 'wrong-flash');
  if (!isCorrect) {
    const correctBtn = document.getElementById(btnMap[t.region]);
    correctBtn.classList.add('correct-flash');
  }

  setTimeout(function() {
    document.querySelectorAll('.bucket-btn').forEach(function(b) {
      b.classList.remove('correct-flash','wrong-flash');
    });
    idx++;
    updateDisplay();
  }, 900);
}

function endGame() {
  document.getElementById('game-area').style.display = 'none';
  const rc = document.getElementById('result-card');
  rc.classList.add('show');
  const total = queue.length;
  document.getElementById('result-big').textContent = correct + '/' + total;
  const pct = correct / total;
  const msgs = [
    'Keep reviewing — the regions will click with practice.',
    'Good effort! Try again to build a faster recall.',
    'Solid! Review the regions for any terms you mixed up.',
    'Great work! You know the regions well.',
    'Perfect! You sorted every term correctly.'
  ];
  document.getElementById('result-msg').textContent = msgs[Math.min(Math.floor(pct * 4), 4)];
}

startGame();
</script>

<script>
  window.CURRENT_MODULE = 4;
  window.LAYOUT = {
    homeUrl:    '../../../../index.html',
    coursesUrl: '../../../index.html',
    navCta:     { label: 'Back to Equine Anatomy Activities', url: '../index.html' }
  };
</script>
<script src="../../../../assets/js/layout.js"></script>
</body>
</html>
