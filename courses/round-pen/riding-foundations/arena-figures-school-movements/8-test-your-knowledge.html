<script>
(function(){
const QUESTION_COUNT=15;
const questionBank=[
{prompt:'What are the dimensions of the small standard arena?',options:['20 meters wide by 40 meters long','20 meters wide by 60 meters long','30 meters wide by 60 meters long','15 meters wide by 40 meters long'],answer:'20 meters wide by 40 meters long',correct:'Correct. The small arena is 20x40 meters, the most common competition and training size.',incorrect:'The small standard arena is 20 meters wide by 40 meters long.'},
{prompt:'What are the dimensions of the large standard arena?',options:['20 meters wide by 60 meters long','20 meters wide by 40 meters long','25 meters wide by 60 meters long','20 meters wide by 80 meters long'],answer:'20 meters wide by 60 meters long',correct:'Correct. The large arena is 20x60 meters, used for more advanced work and higher-level competition.',incorrect:'The large standard arena is 20 meters wide by 60 meters long.'},
{prompt:'Where is letter A located in a standard arena?',options:['At the entry short end','At the far short end','At the midpoint of the left long side','At the center of the arena'],answer:'At the entry short end',correct:'Correct. A is at the entry short end — the end where riders traditionally enter the arena.',incorrect:'A is at the entry short end of the arena.'},
{prompt:'Where is letter C located?',options:['At the far short end, opposite A','At the midpoint of the right long side','At the center of the arena','Next to A at the entry end'],answer:'At the far short end, opposite A',correct:'Correct. C is at the short end opposite A.',incorrect:'C is at the far short end, directly opposite A.'},
{prompt:'Where are letters E and B located?',options:['At the midpoints of each long side','At the short ends','At the corners','At the quarter line intersections'],answer:'At the midpoints of each long side',correct:'Correct. E and B are at the midpoints of the two long sides.',incorrect:'E and B mark the midpoints of the long sides — the widest points of the arena.'},
{prompt:'What is X in a standard arena?',options:['The center point of the arena, at the intersection of the center line and the midline','A physical letter on the right long side wall','The entry point letter at C','The corner between the long side and short end'],answer:'The center point of the arena, at the intersection of the center line and the midline',correct:'Correct. X is the center of the arena — where the A-to-C center line intersects the E-to-B midline. It is not a physical letter on a wall.',incorrect:'X is the center point of the arena. It is not a physical wall letter — it marks the intersection of the center line and the midline.'},
{prompt:'What is the "track" in an arena?',options:['The path along the inside edge of the arena fence','The center line from A to C','The diagonal from H to F','The quarter line 5 meters from the rail'],answer:'The path along the inside edge of the arena fence',correct:'Correct. The track is the path along the inside edge of the fence or wall — what riders follow when going "on the rail."',incorrect:'The track is the path along the inside edge of the arena fence.'},
{prompt:'What is the quarter line?',options:['A line parallel to the long side, approximately 5 meters from the rail','The diagonal from one corner to the other','The path from A to C','The midpoint of the short end'],answer:'A line parallel to the long side, approximately 5 meters from the rail',correct:'Correct. The quarter line is a parallel track about 5 meters inside the long side of the arena.',incorrect:'The quarter line runs parallel to the long side, approximately 5 meters from the rail.'},
{prompt:'What does "tracking left" mean?',options:['Moving counterclockwise, with the left side toward the inside of the arena','Moving clockwise, with the right side toward the inside','Riding diagonally from the left long side to the right','Turning left at letter A'],answer:'Moving counterclockwise, with the left side toward the inside of the arena',correct:'Correct. Tracking left means going counterclockwise — the horse\'s left side faces the inside of the arena.',incorrect:'Tracking left means moving counterclockwise with the horse\'s left side toward the inside.'},
{prompt:'What does "changing rein" mean?',options:['Changing direction — from tracking left to tracking right, or vice versa','Switching which hand holds the reins','Moving from trot to canter','Changing from inside to outside rein contact'],answer:'Changing direction — from tracking left to tracking right, or vice versa',correct:'Correct. Changing rein means changing the direction of travel — typically done across a diagonal.',incorrect:'Changing rein means changing direction of travel — from tracking left to right or vice versa.'},
{prompt:'In a 20x40 arena, where does a 20-meter circle at A touch?',options:['Both long sides at K and F, and reaches X at the far point','Both short ends and the center','Only the left long side','The quarter lines on both sides'],answer:'Both long sides at K and F, and reaches X at the far point',correct:'Correct. A 20-meter circle at A touches K and F on the long sides and reaches X at its far point.',incorrect:'A 20-meter circle at A touches both long sides at K and F, and its far point reaches X.'},
{prompt:'What size circle fits between the center line and the rail when ridden at E or B?',options:['10-meter circle','20-meter circle','15-meter circle','5-meter circle'],answer:'10-meter circle',correct:'Correct. A 10-meter circle at E or B fits exactly between the center line and the long-side rail.',incorrect:'A 10-meter circle at E or B fits between the center line and the rail without touching either.'},
{prompt:'What must happen at the center line when riding a serpentine?',options:['The horse changes bend — briefly straight for one stride, then new bend in the opposite direction','The horse halts momentarily at each crossing','The horse speeds up to maintain rhythm through the change','The rider posts on the same diagonal throughout'],answer:'The horse changes bend — briefly straight for one stride, then new bend in the opposite direction',correct:'Correct. A serpentine requires a bend change at each center-line crossing, with one stride of straightness before the new bend.',incorrect:'At each center-line crossing in a serpentine, the horse is briefly straightened for one stride before the new bend begins.'},
{prompt:'Why is the center line considered a demanding straight track?',options:['There is no wall on either side to help guide the horse','It is the longest straight track in the arena','The letters are placed closest together on the center line','It requires the fastest speed'],answer:'There is no wall on either side to help guide the horse',correct:'Correct. Without the fence as a steering guide, any drift or crookedness is immediately visible on the center line.',incorrect:'The center line is demanding because the wall cannot help — the horse must be truly straight with no fence to drift against.'},
{prompt:'What is a correct halt?',options:['Square, straight, and immobile until asked to move forward','Halting on the move, with the horse stepping naturally to a stop','Stopping on the forehand with the nose in the air','Stopping only when the outside rein is used'],answer:'Square, straight, and immobile until asked to move forward',correct:'Correct. A correct halt is square, straight, and completely immobile — the horse waits for the next aid.',incorrect:'A correct halt is square (all four feet even), straight, and immobile until the next aid is given.'},
{prompt:'What footfall pattern does the rein-back use?',options:['Diagonal pairs, stepping backward','Each leg individually in sequence, backward','All four feet together simultaneously','Lateral pairs, stepping backward'],answer:'Diagonal pairs, stepping backward',correct:'Correct. The rein-back steps backward in diagonal pairs — the same pairs as the trot but in reverse.',incorrect:'The rein-back uses diagonal pairs stepping backward — the same structure as the trot footfall but in reverse.'},
{prompt:'What does the turn on the forehand teach the horse?',options:['To move the hindquarters away from the leg behind the girth','To move the forehand away from the inside rein','To halt from seat alone','To move sideways while remaining on the bit'],answer:'To move the hindquarters away from the leg behind the girth',correct:'Correct. The turn on the forehand directly trains the horse to respond to leg behind the girth by moving the hindquarters sideways.',incorrect:'The turn on the forehand teaches the horse that leg behind the girth means "move the hindquarters away from the pressure."'},
{prompt:'In a turn on the forehand, which part of the horse remains nearly stationary?',options:['The forehand (front feet)','The hindquarters','The haunches','All four feet move equally'],answer:'The forehand (front feet)',correct:'Correct. The forehand remains nearly stationary while the hindquarters step around it.',incorrect:'The forehand remains nearly stationary in a turn on the forehand — the hindquarters step around it.'},
{prompt:'How does a leg yield differ from a turn on the forehand?',options:['A leg yield moves the entire horse forward and sideways simultaneously; a turn on the forehand moves the hindquarters around the stationary forehand','A leg yield is done from halt; a turn on the forehand is done in motion','A leg yield requires lateral bend; a turn on the forehand does not','They are the same movement with different names'],answer:'A leg yield moves the entire horse forward and sideways simultaneously; a turn on the forehand moves the hindquarters around the stationary forehand',correct:'Correct. Both use the lateral leg aid, but a leg yield keeps the whole horse moving forward and sideways while a turn on the forehand pivots the hindquarters around a stationary forehand from halt.',incorrect:'A leg yield is performed in motion — the whole horse moves forward and sideways. A turn on the forehand is from halt, with the forehand nearly stationary.'},
{prompt:'What is the body position of the horse during a correct leg yield?',options:['Straight or with only a slight positioning away from the direction of travel','Bent toward the direction of travel','Bent sharply away from the direction of travel','Head and neck bent inward while haunches trail'],answer:'Straight or with only a slight positioning away from the direction of travel',correct:'Correct. The horse is straight (or minimally positioned) in a leg yield — unlike shoulder-in, there is no lateral bend through the whole body.',incorrect:'In a leg yield, the horse is straight or slightly positioned — not laterally bent as in shoulder-in.'},
{prompt:'What is a diagonal in a standard arena?',options:['A straight line from one long side to the other, crossing through X','The path from A to C','A curved path through the center of the arena','The short end from corner to corner'],answer:'A straight line from one long side to the other, crossing through X',correct:'Correct. A diagonal is a straight line across the arena from one long side to the other, typically passing through X.',incorrect:'A diagonal is a straight line across the arena from one long side to the other, crossing through X.'},
{prompt:'A rider is asked to "ride a 20-meter circle at C." In a 20x40 arena, where does this circle touch the long sides?',options:['At H and M','At K and F','At E and B','At V and S'],answer:'At H and M',correct:'Correct. A 20-meter circle at C touches H and M on the long sides, and the far point of the circle reaches X.',incorrect:'A 20-meter circle at C touches H and M on the long sides and reaches X at its far point.'},
{prompt:'True or false: X is a physical letter mounted on a wall in a standard arena.',options:['False','True'],answer:'False',correct:'Correct. X is a reference point — the center of the arena — not a physical wall letter.',incorrect:'False. X is a reference point at the center of the arena, not a physical letter on the wall.'},
{prompt:'True or false: The rein-back steps backward with each leg moving individually, one at a time.',options:['False','True'],answer:'False',correct:'Correct. The rein-back moves in diagonal pairs, not one leg at a time.',incorrect:'False. The rein-back steps backward in diagonal pairs — the same structure as the trot but in reverse direction.'},
{prompt:'A rider is asked to "change rein across the diagonal from H." In a 20x40 arena, where does this diagonal finish?',options:['At F','At M','At K','At E'],answer:'At F',correct:'Correct. The standard diagonal from H crosses through X and finishes at F.',incorrect:'The diagonal from H crosses through X and finishes at F — a standard change of rein in the small arena.'},
{prompt:'Which school movement is specifically described as "forward and sideways simultaneously"?',options:['Leg yield','Turn on the forehand','Rein-back','Halt'],answer:'Leg yield',correct:'Correct. The leg yield is the fundamental forward-and-sideways lateral movement.',incorrect:'The leg yield is the movement that asks the horse to travel forward and sideways simultaneously.'},
{prompt:'What is a serpentine with three loops in a 20x40 arena?',options:['Three equal half-circles connected across the center line, crossing the center line twice','Three full circles riding from A to C','Three squares alternating left and right','Three diagonal lines from H to F and back'],answer:'Three equal half-circles connected across the center line, crossing the center line twice',correct:'Correct. A three-loop serpentine consists of three equal half-circles connected across the center line, with the center line crossed twice.',incorrect:'A three-loop serpentine is three equal half-circles connected across the center line, crossing the center line twice.'},
{prompt:'What does "tracking right" mean?',options:['Moving clockwise, with the right side toward the inside of the arena','Moving counterclockwise, with the left side toward the inside','Turning right at the next letter','Moving along the right long side only'],answer:'Moving clockwise, with the right side toward the inside of the arena',correct:'Correct. Tracking right means moving clockwise — the horse\'s right side faces the inside of the arena.',incorrect:'Tracking right means moving clockwise with the horse\'s right side toward the inside of the arena.'},
{prompt:'True or false: A turn on the forehand is typically one of the first lateral movements introduced in training.',options:['True','False'],answer:'True',correct:'Correct. The turn on the forehand is a foundational exercise that teaches the response to leg behind the girth — the basis for all lateral work.',incorrect:'True. The turn on the forehand is commonly introduced early in training because it teaches the basic response to leg behind the girth.'},
{prompt:'What is the practical barn application of the leg yield?',options:['Moving a horse sideways away from a gate, fence, or into mounting position','Teaching the horse to halt from seat alone','Preparing the horse for a flying lead change','Moving the horse backward in a straight line'],answer:'Moving a horse sideways away from a gate, fence, or into mounting position',correct:'Correct. The leg yield is the aid used in everyday handling to move a horse sideways — away from a gate, toward a mounting block, or out of a tight space.',incorrect:'The leg yield is used daily in the barn — moving a horse sideways away from a gate, fence, or into position for mounting.'},
{prompt:'What is the term for the path that runs parallel to the long side, approximately 5 meters inside the rail?',options:['Quarter line','Center line','Track','Diagonal'],answer:'Quarter line',correct:'Correct. The quarter line runs parallel to the long side, approximately 5 meters in from the rail.',incorrect:'The quarter line runs parallel to the long side, about 5 meters inside the rail.'},
{prompt:'True or false: School figures and school movements are the same thing.',options:['False','True'],answer:'False',correct:'Correct. School figures are the tracks ridden in the arena (circles, serpentines, diagonals). School movements are specific exercises performed within or across those tracks (halt, leg yield, turn on forehand).',incorrect:'False. School figures describe the track (circles, serpentines, diagonals). School movements are exercises within those tracks (halt, leg yield, turn on the forehand).'}
];
function esc(t){return String(t||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function shuffle(a){return a.map(v=>({v,s:Math.random()})).sort((x,y)=>x.s-y.s).map(i=>i.v)}
const cardEl=document.getElementById('quiz-card'),countEl=document.getElementById('quiz-count'),scoreEl=document.getElementById('quiz-score'),qEl=document.getElementById('quiz-question'),optEl=document.getElementById('quiz-options'),fbEl=document.getElementById('quiz-feedback'),nextBtn=document.getElementById('quiz-next'),scorePanel=document.getElementById('score-panel'),scoreDisplay=document.getElementById('score-display'),scoreMessage=document.getElementById('score-message'),retake=document.getElementById('btn-retake');
let active=[],idx=0,score=0,answered=false;
function start(){active=shuffle(questionBank).slice(0,Math.min(QUESTION_COUNT,questionBank.length)).map(q=>({...q,options:shuffle(q.options)}));idx=0;score=0;scorePanel.classList.remove('show');cardEl.style.display='';showQuestion()}
function showQuestion(){answered=false;const q=active[idx];countEl.textContent='Question '+(idx+1)+' of '+active.length;scoreEl.textContent='Score: '+score;qEl.textContent=q.prompt;fbEl.className='quiz-feedback';fbEl.textContent='';nextBtn.disabled=true;nextBtn.textContent='Next Question';optEl.innerHTML=q.options.map(o=>`<button type="button" class="quiz-option" data-val="${esc(o)}">${esc(o)}</button>`).join('');optEl.querySelectorAll('.quiz-option').forEach(btn=>btn.addEventListener('click',()=>selectAnswer(btn,q)))}
function selectAnswer(btn,q){if(answered)return;answered=true;const correct=q.answer;optEl.querySelectorAll('.quiz-option').forEach(b=>{b.disabled=true;if(b.dataset.val===correct)b.classList.add('correct-ans')});const ok=btn.dataset.val===correct;if(ok)score++;else btn.classList.add('wrong-ans');fbEl.textContent=ok?q.correct:q.incorrect;fbEl.classList.add('show',ok?'correct':'incorrect');scoreEl.textContent='Score: '+score;nextBtn.textContent=idx+1<active.length?'Next Question':'See Results';nextBtn.disabled=false}
nextBtn.addEventListener('click',()=>{idx++;if(idx>=active.length){finish();return}showQuestion()});
function finish(){cardEl.style.display='none';const pct=score/active.length;scoreDisplay.textContent=score+'/'+active.length;scoreMessage.textContent=pct>=.9?'Excellent work. Strong command of arena figures, layout, and school movements.':pct>=.75?'Good work. Review any missed questions and try another round.':pct>=.6?'Getting there. Revisit the lessons and Training Barn, then try again.':'Keep practicing. These concepts get easier with review.';scorePanel.classList.add('show');if(pct>=.8){try{localStorage.setItem('equineEduProgress.arenaFiguresSchoolMovements.testYourKnowledge','true')}catch(e){}}}
retake.addEventListener('click',()=>{start();cardEl.scrollIntoView({behavior:'smooth',block:'start'})});
start()
})();
</script>
