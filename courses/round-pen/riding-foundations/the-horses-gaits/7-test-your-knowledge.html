<script>
(function(){
const QUESTION_COUNT=15;
const questionBank=[
{prompt:'How many beats does the walk have per stride cycle?',options:['Four','Two','Three','One'],answer:'Four',correct:'Correct. The walk is a four-beat gait, with each hoof landing individually.',incorrect:'The walk has four beats — one for each hoof landing separately.'},
{prompt:'Which natural gait has no moment of suspension?',options:['Walk','Trot','Canter','Gallop'],answer:'Walk',correct:'Correct. The walk is the only natural gait without suspension — at least two hooves remain on the ground throughout.',incorrect:'The walk is the gait with no suspension phase.'},
{prompt:'What is the standard footfall sequence of the walk?',options:['Left hind, left fore, right hind, right fore','Left fore, right fore, left hind, right hind','Right fore, left fore, right hind, left hind','Left hind, right hind, left fore, right fore'],answer:'Left hind, left fore, right hind, right fore',correct:'Correct. LH, LF, RH, RF is the standard walk sequence.',incorrect:'The standard walk sequence is left hind, left fore, right hind, right fore.'},
{prompt:'How many beats does the trot have per stride cycle?',options:['Two','Four','Three','One'],answer:'Two',correct:'Correct. The trot is a two-beat gait driven by diagonal pairs.',incorrect:'The trot has two beats — one for each diagonal pair.'},
{prompt:'Which legs move together at the trot?',options:['Diagonal pairs','Same-side pairs','All four simultaneously','Each leg independently'],answer:'Diagonal pairs',correct:'Correct. Diagonal pairs move together at the trot: left fore with right hind, and right fore with left hind.',incorrect:'At the trot, diagonal pairs move together — left fore with right hind, and right fore with left hind.'},
{prompt:'What is the jog?',options:['The Western term for a slow, relaxed trot','A four-beat gait used in English riding','A type of gallop','A faster version of the canter'],answer:'The Western term for a slow, relaxed trot',correct:'Correct. The jog is the Western version of the trot, ridden with less impulsion and a quieter rhythm.',incorrect:'The jog is the Western term for the trot, performed at a slower, more relaxed pace.'},
{prompt:'How many beats does the canter have per stride cycle?',options:['Three','Two','Four','One'],answer:'Three',correct:'Correct. The canter has three beats followed by a moment of suspension.',incorrect:'The canter has three beats per stride cycle, followed by suspension.'},
{prompt:'What is the lope?',options:['The Western term for the canter','A four-beat gait unique to Western horses','A type of extended trot','The English term for the gallop'],answer:'The Western term for the canter',correct:'Correct. The lope is the Western version of the canter — same footfall pattern, slower pace.',incorrect:'The lope is the Western term for the canter, with the same footfall pattern at a quieter pace.'},
{prompt:'How many beats does the gallop have per stride cycle?',options:['Four','Three','Two','Five'],answer:'Four',correct:'Correct. The gallop is a four-beat gait — the diagonal pair that moves as one beat in the canter splits into two separate beats.',incorrect:'The gallop has four beats. The diagonal pair splits apart compared to the canter.'},
{prompt:'How does the gallop differ from the canter in footfall?',options:['The diagonal pair splits into two separate beats','The same-side pair moves together instead','All four feet land simultaneously','The canter has more beats than the gallop'],answer:'The diagonal pair splits into two separate beats',correct:'Correct. At the gallop, the canter\'s diagonal beat separates, creating four individual beats.',incorrect:'At the gallop, the diagonal pair that acts as one beat in the canter splits apart, creating four beats.'},
{prompt:'What does a "lead" refer to at the canter?',options:['Which foreleg reaches furthest forward in the stride','Which hind leg pushes off first','The speed of the stride cycle','The number of beats per stride'],answer:'Which foreleg reaches furthest forward in the stride',correct:'Correct. The lead identifies which foreleg reaches further forward — left lead or right lead.',incorrect:'A lead identifies which foreleg reaches furthest forward at the canter.'},
{prompt:'When circling left, which lead should the horse be on?',options:['Left lead','Right lead','Either lead','No lead — the gallop only'],answer:'Left lead',correct:'Correct. The inside lead matches the direction of travel. Circling left means the horse should be on the left lead.',incorrect:'When circling left, the horse should be on the left lead for balance through the turn.'},
{prompt:'What is a wrong lead?',options:['Cantering on the lead that does not match the direction of travel','Any lead at the gallop','A lead change at the trot','Posting on the wrong diagonal'],answer:'Cantering on the lead that does not match the direction of travel',correct:'Correct. A wrong lead — also called counter-canter when done intentionally — occurs when the horse canters the outside lead for the direction of travel.',incorrect:'A wrong lead means the horse is cantering on the lead that does not match the direction of travel.'},
{prompt:'What is a flying lead change?',options:['Switching leads mid-stride during the suspension phase','Changing leads through the trot','Changing leads through the walk','A change from gallop to canter'],answer:'Switching leads mid-stride during the suspension phase',correct:'Correct. A flying lead change happens during the moment of suspension without breaking gait.',incorrect:'A flying lead change is a mid-stride lead switch that happens during suspension, without returning to trot or walk.'},
{prompt:'What is a simple lead change?',options:['Changing leads by transitioning through the trot or walk','Switching leads during suspension','Asking for a new lead at the gallop only','A specific dressage movement'],answer:'Changing leads by transitioning through the trot or walk',correct:'Correct. In a simple lead change, the horse transitions back to trot or walk before picking up the new lead.',incorrect:'A simple lead change involves transitioning through the trot or walk before picking up the new lead.'},
{prompt:'What is the suspension phase in a gait?',options:['The brief moment when all four feet are off the ground','When the horse slows to a walk','When two feet are on the ground at the same time','The landing phase of the leading foot'],answer:'The brief moment when all four feet are off the ground',correct:'Correct. Suspension is the moment between stride cycles when all four hooves are airborne.',incorrect:'Suspension is the brief moment when all four feet are off the ground between stride beats.'},
{prompt:'Which two gaits have a moment of suspension?',options:['Trot, canter, and gallop','Walk and trot','Walk only','Canter and gallop only'],answer:'Trot, canter, and gallop',correct:'Correct. The trot, canter, and gallop all have moments of suspension. The walk does not.',incorrect:'The trot, canter, and gallop all include a suspension phase. The walk does not.'},
{prompt:'What is the posting trot?',options:['Alternately rising and sitting with each diagonal pair to reduce bounce','Sitting still in the saddle at the trot','A faster version of the trot used in racing','Posting refers to the number of strides per minute'],answer:'Alternately rising and sitting with each diagonal pair to reduce bounce',correct:'Correct. Posting (rising) trot alternates rising and sitting with each diagonal pair, reducing fatigue and allowing the horse to move more freely.',incorrect:'Posting trot means the rider rises and sits alternately with each diagonal to absorb the trot\'s bounce more easily.'},
{prompt:'How can a rider check which lead the horse is cantering on?',options:['Glance down at the inside shoulder — the leading shoulder swings further forward','Listen for which hoof strikes first','Count the beats of the stride','Check the horse\'s tail position'],answer:'Glance down at the inside shoulder — the leading shoulder swings further forward',correct:'Correct. The leading shoulder swings further forward than the other, making it visible with a brief glance.',incorrect:'A rider can check the lead by glancing at the inside shoulder — the leading shoulder swings further forward.'},
{prompt:'What is the typical speed range of a working trot?',options:['8 to 12 miles per hour','25 to 30 miles per hour','4 miles per hour','15 to 20 miles per hour'],answer:'8 to 12 miles per hour',correct:'Correct. A working trot averages roughly 8 to 12 mph depending on breed and training.',incorrect:'A working trot averages roughly 8 to 12 miles per hour.'},
{prompt:'What rider position is commonly used at the gallop?',options:['Two-point or forward seat, rising out of the saddle','Deep sitting seat','Posting trot position','Balanced seat with long stirrups'],answer:'Two-point or forward seat, rising out of the saddle',correct:'Correct. At the gallop, riders move into a two-point or forward seat to allow the horse\'s back to move freely.',incorrect:'At the gallop, riders use a two-point or forward seat, rising out of the saddle with weight in the stirrups.'},
{prompt:'True or false: The canter and gallop have the same number of beats per stride.',options:['False','True'],answer:'False',correct:'Correct. The canter has three beats; the gallop has four. They are distinct gaits.',incorrect:'False. The canter has three beats and the gallop has four — they are not the same gait.'},
{prompt:'True or false: The walk always has at least two feet on the ground.',options:['True','False'],answer:'True',correct:'Correct. The walk has no suspension phase — at least two hooves remain on the ground throughout.',incorrect:'True. The walk is the only gait with no suspension, so at least two feet remain on the ground at all times.'},
{prompt:'Which gait would most likely be used for a warm-up or cool-down?',options:['Walk','Gallop','Canter','Trot'],answer:'Walk',correct:'Correct. The walk is used to warm up and cool down horses because of its low-impact, steady rhythm.',incorrect:'The walk is the standard warm-up and cool-down gait due to its steady, low-impact rhythm.'},
{prompt:'A horse moves with a two-beat rhythm and a visible spring between each stride. Which gait is this?',options:['Trot','Walk','Canter','Gallop'],answer:'Trot',correct:'Correct. The two-beat rhythm with suspension between beats is the defining characteristic of the trot.',incorrect:'A two-beat gait with a spring between strides is the trot.'},
{prompt:'A horse moves with a rolling three-beat rhythm followed by a pause. Which gait is this?',options:['Canter','Trot','Walk','Gallop'],answer:'Canter',correct:'Correct. The three-beat rhythm followed by suspension describes the canter.',incorrect:'A rolling three-beat rhythm with a pause describes the canter.'},
{prompt:'At the gallop, approximately how fast can a fit riding horse travel?',options:['25 to 30 miles per hour','4 to 6 miles per hour','10 to 15 miles per hour','40 to 50 miles per hour'],answer:'25 to 30 miles per hour',correct:'Correct. A fit riding horse typically gallops at 25 to 30 mph. Racehorses can exceed 40 mph but that is exceptional.',incorrect:'A fit riding horse typically gallops at 25 to 30 miles per hour in sustained work.'},
{prompt:'What does it mean for a horse to overtrack at the walk?',options:['The hind hoof lands in front of or on the print left by the fore hoof','The horse walks faster than the trot','The horse crosses its hind legs','The horse moves with a pace-like rhythm'],answer:'The hind hoof lands in front of or on the print left by the fore hoof',correct:'Correct. Overtrack indicates an active, forward walk with good engagement from behind.',incorrect:'Overtrack means the hind hoof lands ahead of the fore hoof print, indicating an engaged, forward walk.'},
{prompt:'What does a pace-like or lateral walk suggest?',options:['Tension, a training issue, or physical discomfort','A naturally fast walk','An extended walk','A horse moving on the correct lead'],answer:'Tension, a training issue, or physical discomfort',correct:'Correct. A lateral walk — where same-side legs move as pairs — departs from the correct four-beat pattern and often signals a problem.',incorrect:'A pace-like or lateral walk can indicate tension, a training issue, or physical discomfort.'},
{prompt:'Which gait is most commonly used in dressage training for developing balance and suppleness?',options:['Trot','Gallop','Walk only','Pace'],answer:'Trot',correct:'Correct. The trot is the primary working gait in dressage training because its consistent two-beat diagonal rhythm develops balance, suppleness, and rhythm.',incorrect:'The trot is the primary working gait in dressage because of its consistent diagonal rhythm.'},
{prompt:'A horse circles right but its left shoulder is reaching further forward. What is the problem?',options:['The horse is on the wrong lead','The horse is on the correct lead','The horse is trotting instead of cantering','There is no problem'],answer:'The horse is on the wrong lead',correct:'Correct. On a right circle, the right lead is correct. A left shoulder leading on a right circle means the horse is on the wrong (left) lead.',incorrect:'On a right circle, the right shoulder should lead. A left shoulder leading means the horse is on the wrong lead.'},
{prompt:'Which term describes the Western canter ridden at a relaxed, unhurried pace?',options:['Lope','Jog','Posting canter','Extended canter'],answer:'Lope',correct:'Correct. The lope is the Western version of the canter, performed at a slower, more relaxed pace.',incorrect:'The lope is the Western term for a calm, unhurried canter.'},
{prompt:'What separates the gallop from being simply a "fast canter"?',options:['The diagonal pair splits into two beats, creating a four-beat gait','The gallop has fewer beats than the canter','The horse does not have suspension at the gallop','The gallop uses the same footfall as the walk'],answer:'The diagonal pair splits into two beats, creating a four-beat gait',correct:'Correct. The split of the diagonal pair makes the gallop a structurally distinct gait from the canter.',incorrect:'The gallop is a separate gait because the diagonal pair splits, creating four beats rather than three.'},
{prompt:'Why does a rider need to know about gaits when observing from the ground?',options:['To spot irregularities that may indicate lameness or soreness','Only to determine which tack to use','To calculate how fast the horse is going','To decide which breed the horse is'],answer:'To spot irregularities that may indicate lameness or soreness',correct:'Correct. An uneven rhythm or shortened stride at a known gait pattern may signal lameness or discomfort.',incorrect:'Knowing gaits from the ground helps a handler spot irregular rhythm or shortened strides that may indicate soreness or lameness.'},
{prompt:'Which pairing is correct?',options:['Walk — four beats, no suspension','Trot — three beats, suspension','Canter — two beats, suspension','Gallop — three beats, no suspension'],answer:'Walk — four beats, no suspension',correct:'Correct. The walk has four beats and no suspension — the only gait without airborne time.',incorrect:'Walk — four beats, no suspension is the correct pairing.'},
{prompt:'Which pairing is correct?',options:['Trot — two beats, diagonal pairs','Walk — two beats, lateral pairs','Canter — four beats, no suspension','Gallop — two beats, diagonal pairs'],answer:'Trot — two beats, diagonal pairs',correct:'Correct. The trot is a two-beat gait driven by diagonal pairs.',incorrect:'Trot — two beats, diagonal pairs is the correct pairing.'},
{prompt:'Which pairing is correct?',options:['Gallop — four beats, suspension','Canter — four beats, no suspension','Trot — three beats, suspension','Walk — two beats, suspension'],answer:'Gallop — four beats, suspension',correct:'Correct. The gallop has four beats and a pronounced moment of suspension.',incorrect:'Gallop — four beats, suspension is the correct pairing.'},
{prompt:'True or false: A horse can only be assessed for gait correctness while being ridden.',options:['False','True'],answer:'False',correct:'Correct. Gaits can be assessed from the ground during longe work, turnout, or hand-walking — and this is often how lameness evaluations are done.',incorrect:'False. Gaits are frequently observed from the ground during longe work, hand-walking, or turnout.'},
{prompt:'What does "impulsion" refer to in the context of gaits?',options:['The energy and push generated from the hindquarters','The number of beats per stride','The speed of the horse','The direction of travel'],answer:'The energy and push generated from the hindquarters',correct:'Correct. Impulsion refers to the forward energy produced by the hindquarters driving the stride.',incorrect:'Impulsion is the forward energy generated from the hindquarters that powers the stride.'},
{prompt:'Which gait is most associated with racing and cross-country riding at speed?',options:['Gallop','Canter','Trot','Walk'],answer:'Gallop',correct:'Correct. The gallop is the fastest natural gait and is used in racing and open-field or cross-country riding at speed.',incorrect:'The gallop is the gait used for racing and fast cross-country work.'}
];
function esc(t){return String(t||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function shuffle(a){return a.map(v=>({v,s:Math.random()})).sort((x,y)=>x.s-y.s).map(i=>i.v)}
const cardEl=document.getElementById('quiz-card'),countEl=document.getElementById('quiz-count'),scoreEl=document.getElementById('quiz-score'),qEl=document.getElementById('quiz-question'),optEl=document.getElementById('quiz-options'),fbEl=document.getElementById('quiz-feedback'),nextBtn=document.getElementById('quiz-next'),scorePanel=document.getElementById('score-panel'),scoreDisplay=document.getElementById('score-display'),scoreMessage=document.getElementById('score-message'),retake=document.getElementById('btn-retake');
let active=[],idx=0,score=0,answered=false;
function start(){active=shuffle(questionBank).slice(0,Math.min(QUESTION_COUNT,questionBank.length)).map(q=>({...q,options:shuffle(q.options)}));idx=0;score=0;scorePanel.classList.remove('show');cardEl.style.display='';showQuestion()}
function showQuestion(){answered=false;const q=active[idx];countEl.textContent='Question '+(idx+1)+' of '+active.length;scoreEl.textContent='Score: '+score;qEl.textContent=q.prompt;fbEl.className='quiz-feedback';fbEl.textContent='';nextBtn.disabled=true;nextBtn.textContent='Next Question';optEl.innerHTML=q.options.map(o=>`<button type="button" class="quiz-option" data-val="${esc(o)}">${esc(o)}</button>`).join('');optEl.querySelectorAll('.quiz-option').forEach(btn=>btn.addEventListener('click',()=>selectAnswer(btn,q)))}
function selectAnswer(btn,q){if(answered)return;answered=true;const correct=q.answer;optEl.querySelectorAll('.quiz-option').forEach(b=>{b.disabled=true;if(b.dataset.val===correct)b.classList.add('correct-ans')});const ok=btn.dataset.val===correct;if(ok)score++;else btn.classList.add('wrong-ans');fbEl.textContent=ok?q.correct:q.incorrect;fbEl.classList.add('show',ok?'correct':'incorrect');scoreEl.textContent='Score: '+score;nextBtn.textContent=idx+1<active.length?'Next Question':'See Results';nextBtn.disabled=false}
nextBtn.addEventListener('click',()=>{idx++;if(idx>=active.length){finish();return}showQuestion()});
function finish(){cardEl.style.display='none';const pct=score/active.length;scoreDisplay.textContent=score+'/'+active.length;scoreMessage.textContent=pct>=.9?'Excellent work. Strong command of gaits, footfall, and leads.':pct>=.75?'Good work. Review any questions missed and try another round.':pct>=.6?'Getting there. Revisit the lessons and Training Barn, then try again.':'Keep practicing. Gait patterns get easier with review.';scorePanel.classList.add('show');if(pct>=.8){try{localStorage.setItem('equineEduProgress.theHorsesGaits.testYourKnowledge','true')}catch(e){}}}
retake.addEventListener('click',()=>{start();cardEl.scrollIntoView({behavior:'smooth',block:'start'})});
start()
})();
</script>
