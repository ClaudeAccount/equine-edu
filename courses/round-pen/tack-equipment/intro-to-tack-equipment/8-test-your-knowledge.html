<script>
(function(){
const QC=15;
const bank=[

/* ── TACK OVERVIEW (8) ── */
{q:"What is tack?",opts:["Any equipment placed on a horse to enable riding, driving, or safe handling","Only the saddle and bridle used for mounted riding","Feed and grooming supplies kept in the tack room","Equipment used exclusively for competition horses"],a:"Any equipment placed on a horse to enable riding, driving, or safe handling",ok:"Correct. Tack includes the saddle, bridle, halter, lead rope, and all related accessories — anything placed on the horse for riding, driving, or handling.",no:"Tack is any equipment placed on a horse to enable riding, driving, or safe handling. This includes halters, lead ropes, and protective equipment, not only saddles and bridles."},

{q:"What is the difference between riding tack and handling tack?",opts:["Riding tack (saddle, bridle) is for mounted work; handling tack (halter, lead rope) is for ground control","Riding tack is leather; handling tack is always nylon","Riding tack is used only in competition; handling tack is used only in the barn","There is no meaningful distinction — both terms refer to the same equipment"],a:"Riding tack (saddle, bridle) is for mounted work; handling tack (halter, lead rope) is for ground control",ok:"Correct. Riding tack enables mounted communication; handling tack enables safe ground control. Both categories are essential to daily horse management.",no:"Riding tack (saddle, bridle) is for mounted work. Handling tack (halter, lead rope) is for ground control. Protective equipment — boots, blankets — is a third category."},

{q:"Why does a halter fit matter, and what is correct halter fit?",opts:["Two fingers under the noseband and four fingers under the crownpiece — too loose catches on objects, too tight causes abrasion","Only the noseband fit matters; the crownpiece can be any tightness","A halter should fit loosely to allow free head movement at all times","Halter fit only matters for horses in active work, not those in turnout"],a:"Two fingers under the noseband and four fingers under the crownpiece — too loose catches on objects, too tight causes abrasion",ok:"Correct. A halter too loose can catch on fence boards, gates, or other objects during turnout, causing panic and injury. Too tight causes skin abrasion and chronic discomfort.",no:"Correct halter fit: two fingers under noseband, four fingers under crownpiece. Too loose risks catching on objects; too tight causes abrasion."},

{q:"What is a cinch, and how does it relate to a girth?",opts:["A cinch is the Western term for what English riders call a girth — both hold the saddle on the horse","A cinch is placed around the horse's neck for driving; a girth is placed around the barrel for riding","A cinch attaches to the front of the saddle; a girth attaches to the back","A cinch is leather only; a girth can be leather or synthetic"],a:"A cinch is the Western term for what English riders call a girth — both hold the saddle on the horse",ok:"Correct. Both terms describe the strap that encircles the barrel behind the elbow to hold the saddle in place. The function is identical; the terminology differs by discipline.",no:"Cinch (Western) and girth (English) both refer to the strap that holds the saddle on the horse by encircling the barrel behind the elbow."},

{q:"What is the primary purpose of the saddle?",opts:["To distribute the rider's weight evenly across a broad area of the horse's back, protecting the spine while providing a stable seat","To amplify the rider's leg aids and transmit them to the horse","To prevent the rider from being thrown during sudden movements","To elevate the rider above the horse's center of gravity for better control"],a:"To distribute the rider's weight evenly across a broad area of the horse's back, protecting the spine while providing a stable seat",ok:"Correct. The saddle's central purpose is weight distribution — spreading the rider's weight across a broad surface area rather than concentrating it at a single point.",no:"The saddle's primary purpose is to distribute the rider's weight evenly across the horse's back, protecting the spine from concentrated loading."},

{q:"Why does the bridle work as a communication device rather than a control device?",opts:["A horse cannot be physically forced into movement through rein pressure — the bridle works because the horse has been trained to yield to specific pressures and seek their release","A bridle physically prevents the horse from turning the wrong direction through mechanical restriction","The bit causes enough discomfort to override the horse's natural inclinations","A horse learns to read the rider's intentions before rein pressure is applied"],a:"A horse cannot be physically forced into movement through rein pressure — the bridle works because the horse has been trained to yield to specific pressures and seek their release",ok:"Correct. The bridle is a communication device. It works because the horse has learned to move away from specific pressures and to seek release. Force through a bridle produces resistance, not trained movement.",no:"The bridle is a communication device, not a control device. It works because the horse is trained to yield to pressure and seek its release — not because rein pressure physically forces the horse to move."},

{q:"Which piece of tack is the primary interface between rider and horse?",opts:["The saddle","The bridle","The halter","The martingale"],a:"The saddle",ok:"Correct. The saddle is the primary interface between rider and horse — it determines how the rider's weight is transmitted to the horse's back and how the horse feels the rider's weight and movement.",no:"The saddle is the primary interface — it determines how rider weight is transmitted to the horse's back and how the rider communicates through seat and weight shifts."},

{q:"What makes driving tack different from riding tack?",opts:["Driving tack uses a harness instead of a saddle and bridle — it distributes pulling power across the chest and shoulders rather than supporting a rider's weight","Driving tack is lighter and uses smaller bits than riding tack","Driving harness includes a saddle but no bridle, as drivers use voice commands only","Driving tack is identical to riding tack with the addition of long reins"],a:"Driving tack uses a harness instead of a saddle and bridle — it distributes pulling power across the chest and shoulders rather than supporting a rider's weight",ok:"Correct. Driving harness is designed to distribute the pulling force across the horse's chest and shoulders. The function and design are distinct from riding equipment.",no:"Driving tack uses a harness system in place of a saddle and bridle. It distributes pulling force across the chest and shoulders — a mechanically distinct function from bearing a rider's weight."},

/* ── SADDLE PARTS AND FIT (11) ── */
{q:"What is the tree of a saddle?",opts:["The internal rigid frame that determines the saddle's shape and how weight is distributed","The leather covering over the seat","The girth attachment point on the underside of the saddle","The strap connecting the saddle to the stirrups"],a:"The internal rigid frame that determines the saddle's shape and how weight is distributed",ok:"Correct. The tree is the internal frame — made of wood, fiberglass, or synthetic material — that gives the saddle its shape and governs weight distribution across the horse's back.",no:"The tree is the saddle's internal frame. It determines shape, size, and how weight is distributed. Everything else attaches to or covers the tree."},

{q:"What are the two most critical dimensions in saddle fit?",opts:["Tree width (matching the horse's shoulder and back) and tree angle (matching the angle of the horse's shoulder)","Seat size and stirrup length","Girth length and panel density","Saddle weight and seat depth"],a:"Tree width (matching the horse's shoulder and back) and tree angle (matching the angle of the horse's shoulder)",ok:"Correct. Tree width and tree angle are the foundational fit dimensions. If either is wrong, no amount of padding or adjustment produces correct fit — the saddle must be changed.",no:"The two critical saddle fit dimensions are tree width and tree angle. Both must match the individual horse's shoulder and back. These cannot be corrected by padding."},

{q:"What is bridging in saddle fit?",opts:["The saddle contacts only the front and back of the horse's back, with a gap in the middle where the panels do not touch","The saddle's panels extend too far under the horse's ribcage","The pommel sits too close to the withers, creating constant pressure","The cantle is angled forward rather than level"],a:"The saddle contacts only the front and back of the horse's back, with a gap in the middle where the panels do not touch",ok:"Correct. Bridging concentrates pressure at two small areas instead of distributing it evenly. Dry spots in the middle of the sweat pattern after riding indicate bridging.",no:"Bridging means the saddle contacts only the front and rear of the horse's back, skipping the middle. Pressure concentrates at two points rather than distributing evenly — it cannot be corrected by adding padding."},

{q:"After a ride, what does an uneven sweat pattern under the saddle area indicate?",opts:["Uneven pressure distribution — dry spots show either concentrated pressure or no contact","Normal variation in coat thickness across the horse's back","A reaction to the saddle's cleaning products","Good fit — an even coat of sweat indicates the saddle is working well"],a:"Uneven pressure distribution — dry spots show either concentrated pressure or no contact",ok:"Correct. Dry spots in the sweat pattern show where the saddle applied so much pressure that sweat was squeezed out, or where the panel didn't contact the back at all. An even sweat pattern indicates even pressure distribution.",no:"An uneven sweat pattern indicates uneven saddle pressure. Dry spots = either concentrated pressure that squeezed out sweat, or a gap in panel contact. Even sweat = even pressure distribution."},

{q:"What do white hairs under a saddle area indicate?",opts:["Chronic concentrated pressure destroyed the pigment in the skin follicles — this is permanent and records past poor fit","Normal coat variation that appears on most horses after regular work","The horse has sensitive skin in that area requiring extra padding","Recent abrasion from a new saddle that has not yet broken in"],a:"Chronic concentrated pressure destroyed the pigment in the skin follicles — this is permanent and records past poor fit",ok:"Correct. White hairs from saddle pressure are a permanent record. The pigment in the skin follicles cannot regenerate once destroyed by chronic pressure. They indicate a history of poor fit.",no:"White hairs under the saddle area = permanent record of past chronic pressure. The pigment was destroyed by sustained localized pressure. These marks do not reverse."},

{q:"Two fingers of clearance between the pommel and the withers indicates:",opts:["Adequate wither clearance — the saddle is not pressing on the withers","The saddle is too narrow — more clearance is needed for correct fit","The saddle is too wide and will rock sideways during riding","The tree is broken and the saddle requires professional assessment"],a:"Adequate wither clearance — the saddle is not pressing on the withers",ok:"Correct. Two fingers of clearance between the pommel and the withers is the standard fit check for wither pressure. Less than this suggests the saddle is sitting too low on the withers.",no:"Two fingers between pommel and withers = adequate clearance. This is the standard check for whether the saddle is pressing on the withers."},

{q:"Why does adding more padding NOT fix a saddle that bridges?",opts:["Over-padding raises the saddle higher, potentially creating more concentrated pressure at the front and back contact points — the tree itself must fit","Padding is always effective for minor fit issues — bridging requires professional evaluation only for severe cases","Adding more padding increases overall pressure, which can help the horse adapt to the saddle","Padding reduces the effectiveness of the tree and makes all fit issues worse"],a:"Over-padding raises the saddle higher, potentially creating more concentrated pressure at the front and back contact points — the tree itself must fit",ok:"Correct. Adding padding under a bridging saddle raises it and can actually worsen the problem by increasing contact pressure at the two bridging points. The tree must fit the horse's back curvature.",no:"Over-padding does not fix bridging — it raises the saddle and can increase pressure at the bridging contact points. The tree itself must match the horse's back curve."},

{q:"What is the pommel of a saddle?",opts:["The front raised arch of the saddle","The rear raised arch of the saddle","The padded underside that contacts the horse's back","The internal rigid frame"],a:"The front raised arch of the saddle",ok:"Correct. The pommel is the front raised arch. In Western saddles, the pommel includes a horn. The cantle is the rear raised arch.",no:"The pommel is the front raised arch of the saddle. The cantle is the rear raised arch."},

{q:"What does the cantle of a saddle do?",opts:["Forms the rear raised arch of the seat, supporting the rider's position","Holds the stirrup bars on either side of the saddle","Distributes weight across the panels under the seat","Connects the front arch to the girth straps"],a:"Forms the rear raised arch of the seat, supporting the rider's position",ok:"Correct. The cantle is the raised rear portion of the saddle seat. It helps keep the rider's weight centered and back secure.",no:"The cantle is the rear raised arch of the saddle seat. The pommel is the front raised arch."},

{q:"What does a Western saddle have that an English saddle does not?",opts:["A horn on the pommel, designed for roping work and providing a grip point","A deeper, cushioned seat for long hours of riding","Integrated stirrups that cannot be removed","A wider gullet channel to protect the spine"],a:"A horn on the pommel, designed for roping work and providing a grip point",ok:"Correct. The horn is the defining structural difference between Western and English saddles. It originated as a working tool for dallying rope during cattle work.",no:"The horn on the pommel is the defining feature of a Western saddle. English saddles have no horn."},

{q:"What is the Western term for the strap that holds the saddle on the horse?",opts:["Cinch","Girth","Surcingle","Crupper"],a:"Cinch",ok:"Correct. In Western tack, the strap that encircles the barrel to hold the saddle is called the cinch. English riders use the term girth for the same piece of equipment.",no:"The Western term is cinch. English riders call it a girth. Both encircle the barrel behind the elbow to hold the saddle in place."},

/* ── BRIDLE PARTS AND BIT TYPES (11) ── */
{q:"What does the crownpiece of a bridle do?",opts:["It rests over the poll and anchors the entire headstall","It crosses the horse's forehead and prevents the bridle from sliding back","It buckles under the jaw to keep the headstall from coming forward","It connects the bit to the rein"],a:"It rests over the poll and anchors the entire headstall",ok:"Correct. The crownpiece rests over the poll — the highest point of the horse's head — and is the primary anchor for all other headstall components.",no:"The crownpiece rests over the poll and anchors the headstall. The browband crosses the forehead. The throatlatch buckles under the jaw."},

{q:"What does the browband do?",opts:["It crosses the horse's forehead and prevents the crownpiece from sliding backward off the poll","It buckles under the jaw and keeps the headstall from coming forward","It connects the cheekpieces to the noseband","It holds the bit at the correct height in the mouth"],a:"It crosses the horse's forehead and prevents the crownpiece from sliding backward off the poll",ok:"Correct. The browband sits across the forehead just below the ears. Without it, the crownpiece and entire headstall would slide backward off the poll.",no:"The browband crosses the forehead and prevents the crownpiece from sliding backward. The throatlatch (not the browband) prevents it from coming forward."},

{q:"What does the throatlatch do, and what is correct throatlatch fit?",opts:["It fastens under the jaw to prevent the headstall from coming forward over the ears; correct fit allows four fingers' width","It holds the bit at the correct height; correct fit creates one to two wrinkles at the lip corner","It encircles the nose to prevent the horse from opening its mouth; it should allow two fingers under it","It connects the reins to the bit rings and should be adjusted for rein length"],a:"It fastens under the jaw to prevent the headstall from coming forward over the ears; correct fit allows four fingers' width",ok:"Correct. The throatlatch fastens under the jaw and prevents the headstall from sliding forward over the ears. Correct fit: four fingers' width. Too tight restricts flexion of the head and throat.",no:"Throatlatch: fastens under the jaw, prevents headstall coming forward. Correct fit = four fingers' width. Too tight restricts head and throat flexion."},

{q:"What is the correct bit height for a snaffle, and how is it adjusted?",opts:["One to two wrinkles at the corner of the mouth; adjusted at the cheekpiece buckles","Three to four wrinkles at the lip corner; adjusted by shortening the reins","The bit should rest on the bars with no lip wrinkles at all; adjusted by lengthening the cheekpieces","The bit should just clear the teeth with no contact at rest; adjusted by raising the crownpiece"],a:"One to two wrinkles at the corner of the mouth; adjusted at the cheekpiece buckles",ok:"Correct. One to two wrinkles indicates correct bit height. Too low: bit contacts teeth or hangs inactive. Too high: constant upward pressure and discomfort. Adjusted at the cheekpiece buckles.",no:"Snaffle bit height: one to two wrinkles at the corner of the mouth. Adjusted at the cheekpiece buckles. Too low = teeth contact; too high = constant pressure."},

{q:"How does a snaffle bit work?",opts:["It applies direct rein pressure in the direction of the rein — left rein taken, pressure on left side of the mouth","It amplifies rein pressure through leverage shanks and applies simultaneous poll and chin groove pressure","It applies pressure only when both reins are taken simultaneously","It redirects rein pressure upward through rings to apply poll pressure"],a:"It applies direct rein pressure in the direction of the rein — left rein taken, pressure on left side of the mouth",ok:"Correct. A snaffle is a direct-pressure bit. Rein movement translates directly to pressure on the same side of the mouth. No leverage is involved.",no:"A snaffle applies direct pressure in the direction of the rein. Left rein = left mouth pressure. No leverage involved. Curb bits use shanks to create leverage."},

{q:"How does a curb bit differ from a snaffle?",opts:["A curb bit uses shanks to create leverage, amplifying rein pressure and simultaneously engaging the poll through the headstall and the chin groove through the curb chain","A curb bit is simply a heavier, stronger snaffle for more control","A curb bit applies only upward pressure with no effect on the chin or poll","A curb bit is used on the horse's nose rather than in its mouth"],a:"A curb bit uses shanks to create leverage, amplifying rein pressure and simultaneously engaging the poll through the headstall and the chin groove through the curb chain",ok:"Correct. Curb bits work through leverage. The shanks amplify rein force and the curb chain engages the chin groove while the headstall applies poll pressure. All three areas are engaged simultaneously.",no:"Curb bits use shank leverage — rein pressure is amplified and applied to the bars, poll, and chin groove simultaneously. Snaffles are direct pressure only."},

{q:"What are the bars of the mouth?",opts:["The toothless gap between the incisors and cheek teeth where the bit rests","The side bars of the headstall that connect the crownpiece to the bit","The metal bars inside the bit that create the mouthpiece shape","The bony ridges along the roof of the horse's mouth"],a:"The toothless gap between the incisors and cheek teeth where the bit rests",ok:"Correct. The bars are the toothless area of the lower jaw between the incisors at the front and the cheek teeth at the back. This is where the bit sits — which is why bit height matters.",no:"The bars are the toothless gap in the lower jaw between the incisors and molars. The bit rests on this area. A bit too low can contact the teeth rather than the bars."},

{q:"What does a noseband do?",opts:["It prevents the horse from opening its mouth to evade bit contact; correct fit allows two fingers under the front band","It holds the bit at the correct height in the mouth","It connects the reins to the bit when no separate rein rings are present","It prevents the horse from lowering its head below the bit line"],a:"It prevents the horse from opening its mouth to evade bit contact; correct fit allows two fingers under the front band",ok:"Correct. The noseband encircles the nose and prevents the horse from opening its mouth to drop or evade the bit. Two fingers under the front band ensures it is not too tight.",no:"The noseband prevents the horse from opening the mouth to evade bit contact. Correct fit = two fingers under the front band. Too tight prevents jaw relaxation and causes tension."},

{q:"What does it mean that the timing of the release — not the pressure itself — is the primary learning signal in rein communication?",opts:["The horse learns to move away from pressure because doing so produces release; the release is the reward that drives the learning","The horse ignores rein pressure until it becomes severe enough to demand a response","The release tells the horse the session is over","The horse memorizes the pattern of rein use and responds to anticipated movements rather than actual rein contact"],a:"The horse learns to move away from pressure because doing so produces release; the release is the reward that drives the learning",ok:"Correct. In pressure-and-release communication, the horse learns to seek the release. The release — not the pressure — is the positive event the horse works to produce. This is the mechanism behind all rein training.",no:"The release is the reward. The horse learns to move away from pressure because doing so immediately produces release. This release-seeking is what drives learning — not the pressure itself."},

/* ── TACK FIT AND SAFETY (10) ── */
{q:"What is the first step when a horse begins pinning its ears during saddling or showing reluctance under saddle?",opts:["Evaluate saddle fit before assuming a training or behavioral cause","Increase warm-up time to see if the behavior resolves","Use a different saddle pad to cushion any pressure points","Consult a trainer about the horse's resistance to the saddling routine"],a:"Evaluate saddle fit before assuming a training or behavioral cause",ok:"Correct. Behavioral signs of tack discomfort — ear pinning, flinching, bucking, hollowing — warrant a tack fit evaluation first. Training responses applied on top of physical discomfort produce incomplete or no improvement.",no:"Behavioral resistance during saddling or under saddle should trigger a tack fit evaluation before any behavioral intervention. The cause is frequently physical."},

{q:"Why should the girth or cinch be tightened gradually rather than all at once?",opts:["To avoid sharp localized pressure and the conditioned pain response (girthiness) that develops when tightening is associated with sudden discomfort","To allow the leather to warm gradually to prevent cracking","Gradual tightening is a trainer preference, not a welfare concern","To give the horse time to shift its weight before the saddle is secured"],a:"To avoid sharp localized pressure and the conditioned pain response (girthiness) that develops when tightening is associated with sudden discomfort",ok:"Correct. Rapid tightening causes sudden sharp pressure and can condition the horse to associate girthing with pain — producing the ear-pinning and girthiness that can persist even after fit is corrected.",no:"Gradual tightening prevents sharp pressure and avoids conditioning the horse to associate girthing with pain. Girthiness is often a learned response to previous rapid-tightening discomfort."},

{q:"Why is tack inspection part of every pre-ride routine?",opts:["Cracked leather, fraying stitching, bent buckles, and worn billets are all failure risks — equipment failure during a ride creates a control emergency","Tack inspection is primarily a regulatory requirement, not a practical safety measure","Tack that has been recently purchased requires no inspection — only old equipment fails","Inspection before each ride trains the horse to stand still for tacking up"],a:"Cracked leather, fraying stitching, bent buckles, and worn billets are all failure risks — equipment failure during a ride creates a control emergency",ok:"Correct. A broken billet, cracked rein, or failed girth buckle during a ride removes the rider's ability to communicate or control. Pre-ride inspection takes under two minutes and prevents the majority of equipment failures.",no:"Pre-ride tack inspection prevents equipment failure during riding. A broken rein or girth buckle creates a control emergency. Cracked leather, fraying stitching, and worn billets are all failure risks."},

{q:"A horse that hollows its back when the rider mounts is most likely expressing:",opts:["Discomfort — either in the back itself or from a saddle that pinches or bridges under the rider's weight","Excitement about beginning work and an anticipatory posture","A trained lateral movement that has been inadvertently cued by mounting","Normal equine postural adjustment to weight that resolves within a few strides"],a:"Discomfort — either in the back itself or from a saddle that pinches or bridges under the rider's weight",ok:"Correct. Hollowing the back when mounted is a specific response to loading discomfort — the horse braces the back away from the source of pain. It warrants saddle fit and back evaluation.",no:"Hollowing the back on mounting indicates loading discomfort. The horse braces away from the source of pain. This warrants saddle fit evaluation and possibly veterinary back assessment."},

{q:"What does it mean for tack fit to be evaluated for the horse separately from the rider?",opts:["A saddle can fit a rider correctly while bridging, pinching, or sitting off-center on the horse — both assessments must be done independently","Saddle fit for the rider and horse are determined by the same measurements and can be assessed together","If the rider is comfortable, the horse is also correctly fitted","Saddle fit for the horse only applies to horses with known back problems"],a:"A saddle can fit a rider correctly while bridging, pinching, or sitting off-center on the horse — both assessments must be done independently",ok:"Correct. A saddle can match a rider's seat size and leg position perfectly while still bridging on the horse's back or pinching the shoulders. The two evaluations are independent and both are required.",no:"Saddle fit for rider and horse are separate evaluations. A well-fitting rider seat does not guarantee correct horse fit. Both must be assessed — the horse's sweat pattern, wither clearance, and panel contact are the horse-side checks."},

{q:"How far behind the horse's elbow should the girth or cinch sit?",opts:["Two to four inches behind the elbow","Directly behind the elbow, touching the elbow fold","Six to eight inches behind the elbow, toward the belly","Position varies with discipline and is not standardized"],a:"Two to four inches behind the elbow",ok:"Correct. The girth or cinch should sit two to four inches behind the elbow. Too close to the elbow causes abrasion and restricts leg movement. Too far back allows the saddle to tip.",no:"The girth or cinch should sit two to four inches behind the elbow — close enough to hold the saddle correctly, far enough to avoid elbow abrasion and leg restriction."},

{q:"What does the presence of white hairs under a saddle area indicate about past management?",opts:["That area experienced chronic concentrated pressure that permanently destroyed skin pigment — the current or previous saddle fit was problematic in that location","That the horse has naturally occurring coat variation that appears in areas of friction","That the horse has sensitive skin requiring extra protection in that area","That the saddle fits correctly — white hairs develop only at correctly padded contact points"],a:"That area experienced chronic concentrated pressure that permanently destroyed skin pigment — the current or previous saddle fit was problematic in that location",ok:"Correct. White hairs are a permanent record — once destroyed by chronic pressure, pigment follicles do not recover. Their presence indicates a history of poor fit and warrants careful current-saddle assessment.",no:"White hairs = permanent record of chronic pressure damage. Pigment follicles cannot recover once destroyed. They indicate past poor fit and warrant evaluation of current equipment."},

{q:"What is the minimum clearance check for a correctly fitting saddle at the withers?",opts:["Two fingers between the pommel and the withers","The saddle should just touch the withers to ensure it is sitting at the correct angle","Four fingers between the pommel and the withers","The pommel should sit at least one inch above the withers at all times"],a:"Two fingers between the pommel and the withers",ok:"Correct. Two fingers between the pommel and the withers is the standard check. Less than this suggests the saddle is sitting too low and may contact the withers under the rider's weight.",no:"Standard wither clearance check: two fingers between pommel and withers. Less suggests the saddle sits too low and may pressure the withers under rider weight."},

{q:"Cracked leather on tack is a safety concern because:",opts:["It loses structural strength and can break under load, creating a control emergency during riding","It makes the equipment look worn and should be replaced before competitions","Cracked leather changes the way the bit sits in the horse's mouth","Cracked leather increases friction and causes galls along the girth line"],a:"It loses structural strength and can break under load, creating a control emergency during riding",ok:"Correct. Leather that is cracked or dry has lost structural integrity. A billet, rein, or girth that breaks under load during riding removes the rider's ability to steer or control the horse.",no:"Cracked leather is structurally weakened and can snap under the load of normal riding — breaking a rein, billet, or stirrup leather mid-ride creates a control emergency."},

{q:"A horse with uneven muscle development on either side of the topline likely has:",opts:["A history of uneven loading from saddle fit or work patterns — one side is bearing more weight than the other","Naturally asymmetric conformation that cannot be modified through management","A neurological condition affecting muscle function on one side","Been trained for one-sided disciplines that intentionally develop asymmetric muscle patterns"],a:"A history of uneven loading from saddle fit or work patterns — one side is bearing more weight than the other",ok:"Correct. Uneven topline muscle development indicates that one side has been loaded more heavily than the other over time. Saddle fit that pinches one side, or consistent work patterns that favor one direction, are common causes.",no:"Uneven topline muscle development = uneven loading over time. A saddle that doesn't sit level, or consistent one-sided work, causes one side to develop more than the other. This is a fit and training signal."}

];

function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let qs=[],cur=0,sc=0,ans=false;
function init(){qs=sh([...bank]).slice(0,QC);cur=0;sc=0;ans=false;
  document.getElementById('score-panel').style.display='none';document.getElementById('quiz-card').style.display='';show();}
function show(){const q=qs[cur];
  document.getElementById('quiz-count').textContent='Question '+(cur+1)+' of '+QC;
  document.getElementById('quiz-score').textContent='Score: '+sc;
  document.getElementById('quiz-question').textContent=q.q;
  document.getElementById('quiz-feedback').textContent='';
  document.getElementById('quiz-next').disabled=true;ans=false;
  const opts=sh([...q.opts]);
  document.getElementById('quiz-options').innerHTML=opts.map(o=>'<button class="quiz-option" data-v="'+encodeURIComponent(o)+'">'+o+'</button>').join('');
  document.querySelectorAll('.quiz-option').forEach(b=>b.addEventListener('click',function(){
    if(ans)return;ans=true;const ch=decodeURIComponent(this.dataset.v);const ok=ch===q.a;
    if(ok)sc++;
    document.querySelectorAll('.quiz-option').forEach(x=>{x.classList.remove('correct','incorrect');
      if(decodeURIComponent(x.dataset.v)===q.a)x.classList.add('correct');
      else if(x===this&&!ok)x.classList.add('incorrect');
    });
    document.getElementById('quiz-feedback').innerHTML='<span class="'+(ok?'feedback-ok':'feedback-no')+'">'+(ok?q.ok:q.no)+'</span>';
    document.getElementById('quiz-next').disabled=false;
  }));}
document.getElementById('quiz-next').addEventListener('click',function(){cur++;
  if(cur>=QC){document.getElementById('quiz-card').style.display='none';
    document.getElementById('score-panel').style.display='';
    document.getElementById('score-display').textContent=sc+'/'+QC;
    const p=sc/QC;document.getElementById('score-message').textContent=p>=.9?'Excellent work.':p>=.7?'Good understanding — review any missed questions.':'Use the Study Guide to revisit the concepts, then try again.';
  }else show();});
document.getElementById('btn-retake').addEventListener('click',init);init();
})();
</script>
