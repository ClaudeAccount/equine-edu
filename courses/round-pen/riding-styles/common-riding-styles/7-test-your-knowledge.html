<script>
(function(){
const QUESTION_COUNT=15;
const questionBank=[
{prompt:'Which statement best explains why riding styles developed?',options:['Different jobs and traditions required horses to work in different ways','All riders wanted identical equipment','Horse breeds stopped changing','Show rules came before practical work'],answer:'Different jobs and traditions required horses to work in different ways',correct:'Correct. Styles grew from practical needs, terrain, traditions, and later sport rules.',incorrect:'Not quite. The biggest reason is that different jobs and places required different ways of riding.'},
{prompt:'Which discipline is part of the Western riding style?',options:['Reining','Dressage','Hunters','Eventing'],answer:'Reining',correct:'Correct. Reining is a Western discipline.',incorrect:'Reining is the Western discipline in this list.'},
{prompt:'Which discipline is part of the English riding style?',options:['Dressage','Barrel racing','Ranch riding','Cutting'],answer:'Dressage',correct:'Correct. Dressage is an English discipline focused on precise, balanced movement.',incorrect:'Dressage is the English discipline listed here.'},
{prompt:'What is barrel racing designed around?',options:['A timed cloverleaf pattern around three barrels','A judged dressage test','A smooth hunter round','Sorting cattle slowly'],answer:'A timed cloverleaf pattern around three barrels',correct:'Correct. Barrel racing is a timed Western event.',incorrect:'Barrel racing uses a timed cloverleaf pattern around three barrels.'},
{prompt:'What is pole bending designed around?',options:['Weaving through a straight line of poles as quickly and cleanly as possible','A judged dressage test','A hunter round over fences','A team ball game with mallets'],answer:'Weaving through a straight line of poles as quickly and cleanly as possible',correct:'Correct. Pole bending is a timed Western speed event.',incorrect:'Pole bending asks the horse and rider to weave through poles in a timed pattern.'},
{prompt:'What is Western horsemanship designed to show?',options:['Rider position, control, and pattern accuracy in Western tack','A formal dressage test','A smooth jumping course','A gallop over a racetrack'],answer:'Rider position, control, and pattern accuracy in Western tack',correct:'Correct. Western horsemanship is the Western counterpart to rider-focused equitation.',incorrect:'Western horsemanship focuses on rider position, control, and pattern accuracy in Western tack.'},
{prompt:'What is dressage designed to show?',options:['Precise, balanced movement and clear communication','Fastest time around barrels','A relaxed jog on the rail only','Cattle handling'],answer:'Precise, balanced movement and clear communication',correct:'Correct. Dressage is built around accuracy, balance, and communication.',incorrect:'Dressage focuses on precise, balanced movement and communication.'},
{prompt:'In hunter classes, what is usually emphasized?',options:['Smooth rhythm, good form, and a polished jumping round','The fastest possible time only','Sliding stops and spins','A roping run'],answer:'Smooth rhythm, good form, and a polished jumping round',correct:'Correct. Hunters are judged on the quality and smoothness of the round.',incorrect:'Hunters reward smooth rhythm, form, and an attractive round.'},
{prompt:'In jumper classes, what usually matters most?',options:['Faults and time','Mane braiding only','The quietest jog','A cattle pattern'],answer:'Faults and time',correct:'Correct. Jumpers are scored by faults and time.',incorrect:'Jumpers are about clearing the course with few faults and efficient time.'},
{prompt:'Which discipline combines dressage, cross-country, and stadium jumping?',options:['Eventing','Western pleasure','Ranch riding','Saddle seat'],answer:'Eventing',correct:'Correct. Eventing has three phases.',incorrect:'Eventing is the three-phase sport.'},
{prompt:'Which English-style sport uses mallets, a ball, and team play?',options:['Polo','Reining','Western pleasure','Pole bending'],answer:'Polo',correct:'Correct. Polo is a fast team sport played from horseback.',incorrect:'Polo is the team sport that uses mallets and a ball.'},
{prompt:'Which English-style sport is centered on galloping over a set distance for speed?',options:['Horse racing','Ranch riding','Cutting','Western horsemanship'],answer:'Horse racing',correct:'Correct. Horse racing is centered on speed over a set distance.',incorrect:'Horse racing is the speed-focused sport over a set distance.'},
{prompt:'Which Western discipline rewards a horse that looks useful for ranch-type work?',options:['Ranch riding','Equitation','Hunters','Dressage'],answer:'Ranch riding',correct:'Correct. Ranch riding connects closely to practical ranch movement and usefulness.',incorrect:'Ranch riding is the discipline focused on ranch-type usefulness.'},
{prompt:'Which Western class focuses on a quiet, willing horse moving steadily at walk, jog, and lope?',options:['Western pleasure','Barrel racing','Jumpers','Eventing'],answer:'Western pleasure',correct:'Correct. Western pleasure rewards a calm, consistent way of going.',incorrect:'Western pleasure is the quiet rail class described here.'},
{prompt:'Which activity is most connected to cattle work?',options:['Cutting or roping','Dressage','Hunter under saddle','Saddle seat'],answer:'Cutting or roping',correct:'Correct. Cutting and roping are Western cattle-work events.',incorrect:'Cutting and roping are cattle-work events.'},
{prompt:'What does the term discipline mean in this course?',options:['A specific riding activity or event within a riding style','Only the saddle a rider uses','A horse color category','A barn rule'],answer:'A specific riding activity or event within a riding style',correct:'Correct. Western and English are main riding styles; disciplines are the specific activities.',incorrect:'A discipline is the specific riding activity inside a larger riding style.'},
{prompt:'Which pairing is correct?',options:['English - dressage','Western - hunters','English - barrel racing','Western - eventing'],answer:'English - dressage',correct:'Correct. Dressage belongs to the English riding style.',incorrect:'The correct pairing is English - dressage.'},
{prompt:'Which pairing is correct?',options:['Western - reining','English - roping','Western - dressage','English - barrel racing'],answer:'Western - reining',correct:'Correct. Reining is a Western discipline.',incorrect:'Western - reining is the correct pair.'},
{prompt:'Why does tack often look different between riding styles?',options:['Tack changes to support the task, rider position, and communication needed','Tack differences are only decorative','All disciplines require the same saddle','Tack has no connection to the style'],answer:'Tack changes to support the task, rider position, and communication needed',correct:'Correct. Tack is shaped by purpose.',incorrect:'Tack often supports the job, balance, and communication style.'},
{prompt:'Which clue points most strongly toward Western riding?',options:['Working cattle or ranch-type tasks','A dressage test','A hunter course','Stadium jumping faults'],answer:'Working cattle or ranch-type tasks',correct:'Correct. Ranch and stock work are major Western roots.',incorrect:'Cattle and ranch work point strongly toward Western riding.'},
{prompt:'Which clue points most strongly toward English riding?',options:['A formal dressage test or jumping course','A roping run','A cloverleaf barrel pattern','A cutting pen'],answer:'A formal dressage test or jumping course',correct:'Correct. Dressage and jumping are common English discipline clues.',incorrect:'Dressage tests and jumping courses point toward English riding.'},
{prompt:'True or false: Western and English are main riding styles, not just one single event each.',options:['True','False'],answer:'True',correct:'Correct. Each main style includes many disciplines.',incorrect:'Western and English are main riding styles with many disciplines inside them.'},
{prompt:'True or false: A horse can only ever learn one riding discipline.',options:['True','False'],answer:'False',correct:'Correct. Many horses can learn more than one discipline with appropriate training.',incorrect:'Horses can learn multiple disciplines, though each one has different expectations.'},
{prompt:'What is equitation most focused on?',options:['The rider position and effectiveness','Fastest time around barrels','A sliding stop','Sorting cattle'],answer:'The rider position and effectiveness',correct:'Correct. Equitation centers on the rider.',incorrect:'Equitation is focused on rider position and effectiveness.'}
];
function esc(t){return String(t||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function shuffle(a){return a.map(v=>({v,s:Math.random()})).sort((x,y)=>x.s-y.s).map(i=>i.v)}
const cardEl=document.getElementById('quiz-card'),countEl=document.getElementById('quiz-count'),scoreEl=document.getElementById('quiz-score'),qEl=document.getElementById('quiz-question'),optEl=document.getElementById('quiz-options'),fbEl=document.getElementById('quiz-feedback'),nextBtn=document.getElementById('quiz-next'),scorePanel=document.getElementById('score-panel'),scoreDisplay=document.getElementById('score-display'),scoreMessage=document.getElementById('score-message'),retake=document.getElementById('btn-retake');
let active=[],idx=0,score=0,answered=false;
function start(){active=shuffle(questionBank).slice(0,Math.min(QUESTION_COUNT,questionBank.length)).map(q=>({...q,options:shuffle(q.options)}));idx=0;score=0;scorePanel.classList.remove('show');cardEl.style.display='';showQuestion()}
function showQuestion(){answered=false;const q=active[idx];countEl.textContent='Question '+(idx+1)+' of '+active.length;scoreEl.textContent='Score: '+score;qEl.textContent=q.prompt;fbEl.className='quiz-feedback';fbEl.textContent='';nextBtn.disabled=true;nextBtn.textContent='Next Question';optEl.innerHTML=q.options.map(o=>`<button type="button" class="quiz-option" data-val="${esc(o)}">${esc(o)}</button>`).join('');optEl.querySelectorAll('.quiz-option').forEach(btn=>btn.addEventListener('click',()=>selectAnswer(btn,q)))}
function selectAnswer(btn,q){if(answered)return;answered=true;const correct=q.answer;optEl.querySelectorAll('.quiz-option').forEach(b=>{b.disabled=true;if(b.dataset.val===correct)b.classList.add('correct-ans')});const ok=btn.dataset.val===correct;if(ok)score++;else btn.classList.add('wrong-ans');fbEl.textContent=ok?q.correct:q.incorrect;fbEl.classList.add('show',ok?'correct':'incorrect');scoreEl.textContent='Score: '+score;nextBtn.textContent=idx+1<active.length?'Next Question':'See Results';nextBtn.disabled=false}
nextBtn.addEventListener('click',()=>{idx++;if(idx>=active.length){finish();return}showQuestion()});
function finish(){cardEl.style.display='none';const pct=score/active.length;scoreDisplay.textContent=score+'/'+active.length;scoreMessage.textContent=pct>=.9?'Excellent work. You have a strong command of this material.':pct>=.75?'Good work. Review the questions you missed and try another round.':pct>=.6?'You are getting there. Revisit the lesson and Training Barn, then try again.':'Keep practicing. These terms will get easier with review.';scorePanel.classList.add('show');if(pct>=.8){try{localStorage.setItem('equineEduProgress.commonRidingStyles.testYourKnowledge','true')}catch(e){}}}
retake.addEventListener('click',()=>{start();cardEl.scrollIntoView({behavior:'smooth',block:'start'})});
start()
})();
</script>
